<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeMSIC Points</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* layout: fixed app shell — dark rail, light canvas, floating screen switcher */
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#fafbfa;
  --ink:#101f1b; --ink-2:#36514a; --muted:#6b807a;
  --line:#e0e7e3; --line-2:#eef2ef;
  --accent:#0f6b56; --accent-2:#0b513f; --accent-soft:#e7f1ed; --accent-ink:#ffffff; --accent-ring:#e7f1ed;
  --amber:#9a5b06; --amber-soft:#fdf2e0; --amber-line:#f2e0c0; --amber-ink:#6f4204;
  --red:#a1312a; --red-soft:#fbeceb; --red-line:#edd4d2;
  --blue:#1a5a8c; --blue-soft:#e9f1f8; --blue-line:#d3e4f1; --blue-ink:#154a74;
  --violet:#5b3f9e; --violet-soft:#efeafb;
  --good-line:#cfe5dd; --flag-row:#fffdf7;
  --hot-line:#f0dfc2; --hot-top:#fffaf1; --hot-bot:#ffffff;
  --chip-bg:#eef2ef; --chip-fg:#55665f; --step-bg:#e9efec; --knob:#ffffff;
  --dot:#1cab84; --dot-ring:#d6f2e9;
  --side-bg:#0c1a16; --side-fg:#cfdcd7; --side-head:#ffffff; --side-muted:#7e948d; --side-label:#6c827b;
  --side-on:#163028; --side-line:#1b332c; --side-chip:#1e4034; --side-chip-fg:#9fe8cf; --side-foot-b:#eaf2ef;
  --auth-fg:#dbe7e3; --auth-sub:#9bb0a9; --auth-step:#b9cbc5;
  --scrim:rgba(8,18,15,.55);
  --r:12px; --r-sm:8px;
  --sans:"Inter","Inter Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(16,31,27,.05), 0 8px 24px -12px rgba(16,31,27,.14);
  --shadow-lift:0 6px 30px -10px rgba(16,31,27,.3);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#121c19; --surface-2:#162120;
  --ink:#e9f0ed; --ink-2:#b0c4be; --muted:#829791;
  --line:#26342f; --line-2:#1b2522;
  --accent:#2fbf96; --accent-2:#86e3c3; --accent-soft:#15322a; --accent-ink:#06211a; --accent-ring:#1b4538;
  --amber:#e0a35a; --amber-soft:#2e2412; --amber-line:#473314; --amber-ink:#f0c58c;
  --red:#ef8d83; --red-soft:#321b19; --red-line:#4a2823;
  --blue:#7fb8e8; --blue-soft:#13273a; --blue-line:#23405c; --blue-ink:#a8d0ef;
  --violet:#b7a0ea; --violet-soft:#221c38;
  --good-line:#1f4538; --flag-row:#1e2418;
  --hot-line:#473314; --hot-top:#241c0e; --hot-bot:#121c19;
  --chip-bg:#1d2927; --chip-fg:#9fb3ac; --step-bg:#1d2927; --knob:#e9f0ed;
  --dot:#2fbf96; --dot-ring:#17352c;
  --side-bg:#0f1b17; --side-on:#1b3a30; --side-line:#203b33; --side-chip:#22493c;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.66);
  --shadow-lift:0 6px 30px -10px rgba(0,0,0,.75);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#121c19; --surface-2:#162120;
  --ink:#e9f0ed; --ink-2:#b0c4be; --muted:#829791;
  --line:#26342f; --line-2:#1b2522;
  --accent:#2fbf96; --accent-2:#86e3c3; --accent-soft:#15322a; --accent-ink:#06211a; --accent-ring:#1b4538;
  --amber:#e0a35a; --amber-soft:#2e2412; --amber-line:#473314; --amber-ink:#f0c58c;
  --red:#ef8d83; --red-soft:#321b19; --red-line:#4a2823;
  --blue:#7fb8e8; --blue-soft:#13273a; --blue-line:#23405c; --blue-ink:#a8d0ef;
  --violet:#b7a0ea; --violet-soft:#221c38;
  --good-line:#1f4538; --flag-row:#1e2418;
  --hot-line:#473314; --hot-top:#241c0e; --hot-bot:#121c19;
  --chip-bg:#1d2927; --chip-fg:#9fb3ac; --step-bg:#1d2927; --knob:#e9f0ed;
  --dot:#2fbf96; --dot-ring:#17352c;
  --side-bg:#0f1b17; --side-on:#1b3a30; --side-line:#203b33; --side-chip:#22493c;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.66);
  --shadow-lift:0 6px 30px -10px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;font-weight:650}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side{background:var(--side-bg);color:var(--side-fg);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 0}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#19a37f,#0c6049);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.02em}
.brand b{color:var(--side-head);font-size:14.5px;font-weight:650;display:block;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--side-muted);display:block}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-label);padding:0 8px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);color:var(--side-fg);font-size:13.3px}
.nav.on{background:var(--side-on);color:var(--side-head);font-weight:550}
.nav .ic{width:16px;text-align:center;opacity:.85;font-size:13px}
.nav .count{margin-left:auto;background:var(--side-chip);color:var(--side-chip-fg);font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.nav.on .count{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px;display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:99px;background:var(--side-chip);color:var(--side-chip-fg);display:grid;place-items:center;font-size:11.5px;font-weight:650}
.side-foot small{display:block;color:var(--side-muted);font-size:11px}
.side-foot b{font-size:12.5px;color:var(--side-foot-b);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.topbar .spacer{flex:1}
.termsel{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--dot);box-shadow:0 0 0 3px var(--dot-ring)}
.content{padding-block:24px 92px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head h1{font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.3px;max-width:62ch}
.page-head .spacer{flex:1}

/* ---------- atoms ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:12.3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14.5px}
.card-h .spacer{flex:1}
.card-h small{color:var(--muted);font-size:12px}
.card-b{padding:18px}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.row{display:flex;gap:14px}
.sub{color:var(--muted);font-size:12.4px}
.mono{font-family:var(--mono);font-size:12.3px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font-size:25px;font-weight:650;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.tile.hot{border-color:var(--hot-line);background:linear-gradient(180deg,var(--hot-top),var(--hot-bot))}
.tile.hot .v{color:var(--amber)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.draft{background:var(--chip-bg);color:var(--chip-fg)}
.pill.pend{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--accent-soft);color:var(--accent-2)}
.pill.mod{background:var(--blue-soft);color:var(--blue)}
.pill.ret{background:var(--red-soft);color:var(--red)}
.pill.tag{background:var(--violet-soft);color:var(--violet)}
.pill.flat{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13.2px;vertical-align:middle}
td .who{min-width:142px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:9px}
.ava{width:26px;height:26px;border-radius:99px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:10.8px;font-weight:650;flex:none}
.who b{font-weight:600;font-size:13.2px;display:block;white-space:nowrap}
.who small{color:var(--muted);font-size:11.4px;font-family:var(--mono);white-space:nowrap}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.3px;font-weight:600;color:var(--ink-2)}
.inp{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13.2px;background:var(--surface);color:var(--ink);font-family:inherit}
.inp.ph{color:var(--muted)}
.inp.sel{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp.sel::after{content:"▾";color:var(--muted);font-size:10px}
.hint{font-size:11.6px;color:var(--muted)}
.cellinp{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:var(--surface);color:var(--ink);width:100%;font-family:inherit}
.cellinp.sel{display:flex;align-items:center;justify-content:space-between;white-space:nowrap;min-width:150px}
.cellinp.sel::after{content:"▾";color:var(--muted);font-size:9px}
.pts{width:72px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--ink)}
.pts.edited{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue)}
.delta{font-size:11px;font-weight:650;color:var(--blue);margin-left:6px}
.delta.down{color:var(--red)}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-sm);font-size:12.7px;line-height:1.45}
.note.warn{background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-line)}
.note.info{background:var(--blue-soft);color:var(--blue-ink);border:1px solid var(--blue-line)}
.note.good{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--good-line)}
.note .ic{font-size:14px;line-height:1.2}

.steps{display:flex;align-items:center;gap:0;margin-bottom:20px}
.step{display:flex;align-items:center;gap:9px;padding-right:14px}
.step .n{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:650;background:var(--step-bg);color:var(--muted)}
.step b{font-size:12.8px;color:var(--muted);font-weight:600}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.on b{color:var(--ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent-2)}
.step.done b{color:var(--ink-2)}
.step-line{height:1px;background:var(--line);flex:1;min-width:22px;margin-right:14px}

.flowbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.flowbar .n{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-weight:600;color:var(--ink-2)}
.flowbar .n.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flowbar .n.now{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}

.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.lb{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.lb:last-child{border-bottom:0}
.lb .rank{width:20px;color:var(--muted);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.lb .nm{flex:1;min-width:0}
.lb .nm b{font-size:13px;font-weight:600;display:block}
.lb .nm small{color:var(--muted);font-size:11.3px}
.lb .pv{font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px;width:46px;text-align:right}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tab{padding:11px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent-2);border-color:var(--accent)}

.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl .tdot{width:17px;height:17px;border-radius:99px;background:var(--surface);border:2px solid var(--line);flex:none;margin-top:1px}
.tl.on .tdot{border-color:var(--accent);background:var(--accent-soft)}
.tl .tb b{font-size:12.8px;font-weight:600;display:block}
.tl .tb small{color:var(--muted);font-size:11.6px}

/* ---------- login ---------- */
.auth{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1.05fr .95fr}
.auth-l{background:var(--side-bg);color:var(--auth-fg);padding-block:46px;padding-left:max(52px,env(safe-area-inset-left,0px));padding-right:52px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.auth-l::after{content:"";position:absolute;width:520px;height:520px;right:-200px;bottom:-240px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(25,163,127,.3),transparent 62%)}
.auth-l h2{color:var(--side-head);font-size:28px;line-height:1.22;margin-top:auto;max-width:20ch;letter-spacing:-.02em}
.auth-l p{color:var(--auth-sub);max-width:42ch;font-size:13.6px;margin:14px 0 0}
.auth-steps{margin-top:26px;display:flex;flex-direction:column;gap:12px;z-index:1}
.as{display:flex;gap:11px;align-items:flex-start;font-size:12.8px;color:var(--auth-step)}
.as .n{width:21px;height:21px;border-radius:99px;background:var(--side-on);color:var(--side-chip-fg);display:grid;place-items:center;font-size:11px;font-weight:650;flex:none}
.auth-r{display:grid;place-items:center;padding-block:40px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.authbox{width:100%;max-width:368px}
.authbox h3{font-size:19px;margin-bottom:5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 4px}
.role{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;background:var(--surface);font-size:12.6px}
.role.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-ring)}
.role b{display:block;font-size:13px;font-weight:650}
.role small{color:var(--muted);font-size:11.3px}

/* ---------- misc ---------- */
.kv{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.kv .v{font-size:13.3px;font-weight:550}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:16px;text-align:center;color:var(--muted);font-size:12.6px;background:var(--surface-2)}
.rowsel{display:flex;gap:6px}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:99px;background:var(--knob);top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:16px}
.syncbar{display:flex;align-items:center;gap:9px;font-size:12.4px;color:var(--ink-2);background:var(--accent-soft);border:1px solid var(--good-line);border-radius:99px;padding:5px 13px}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{display:none}
  .content{padding-block:14px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .auth{grid-template-columns:1fr}
  .auth-l{display:none}
  .mob-top{display:flex!important}
  .scroll-x{overflow-x:auto}
}
.mob-top{display:none;align-items:center;gap:10px}
/* Wide tables scroll inside their own box at every width. Without this a table
   wider than its column spills under the neighbouring column, which then takes
   its clicks. */
.scroll-x{overflow-x:auto;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}

/* ---------- working-artifact additions ---------- */
.mnav{display:none}
@media(max-width:760px){
  .mnav{display:flex;gap:6px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
  .mnav button{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600}

// ---------- storage: the shared db, or the visitor's own browser ----------
/** Google Firestore — the GitHub Pages build. F is the firebase-firestore module. */
function firestoreStore(db, F) {
  const rows = (snap) => snap.docs.map((x) => Object.assign({ id: x.id }, x.data()));
  const meta = (s) => ({ fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites });
  return {
    mode: "live",
    async get(p) { const s = await F.getDoc(F.doc(db, p)); return s.exists() ? s.data() : null; },
    set: (p, data) => F.setDoc(F.doc(db, p), data),
    update: (p, data) => F.updateDoc(F.doc(db, p), data),
    del: (p) => F.deleteDoc(F.doc(db, p)),
    watch: (c, cb, err) => F.onSnapshot(F.collection(db, c), (s) => cb(rows(s), meta(s)), err),
    watchDoc: (p, cb, err) => F.onSnapshot(F.doc(db, p), (s) => cb(s.exists() ? s.data() : null, meta(s)), err),
  };
}

function liveStore(db) {
  const rows = (snap) => snap.docs.filter((x) => x.exists).map((x) => Object.assign({ id: x.id }, x.data()));
  return {
    mode: "live",
    async get(p) { const s = await db.doc(p).get(); return s.exists ? s.data() : null; },
    set: (p, data) => db.doc(p).set(data),
    update: (p, data) => db.doc(p).update(data),
    del: (p) => db.doc(p).delete(),
    watch: (c, cb, err) => db.collection(c).onSnapshot((s) => cb(rows(s), s.metadata), err),
    watchDoc: (p, cb, err) => db.doc(p).onSnapshot((s) => cb(s.exists ? s.data() : null, s.metadata), err),
  };
}

function localStore() {
  // Bump this whenever the demo's example data changes: a browser holding an
  // older copy then starts fresh instead of showing stale names and committees.
  const KEY = "lemsic-points-demo-v2";
  try { localStorage.removeItem("lemsic-points-demo-v1"); } catch (e) { /* storage blocked */ }
  let docs = null;
  try { docs = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { docs = null; }
  if (!docs || typeof docs !== "object") docs = seedDemo();
  const watchers = new Set();
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const parent = (p) => p.split("/").slice(0, -1).join("/");
  const list = (c) => Object.keys(docs).filter((p) => parent(p) === c).sort().map((p) => Object.assign({ id: p.split("/").pop() }, clone(docs[p])));
  const meta = { fromCache: false, hasPendingWrites: false };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(docs)); } catch (e) { /* private window: the demo still works for this visit */ } }
  function notify(p) {
    const c = parent(p);
    watchers.forEach((w) => {
      if (w.c === c) w.cb(list(c), meta);
      if (w.p === p) w.cb(docs[p] ? clone(docs[p]) : null, meta);
    });
  }
  return {
    mode: "demo",
    async get(p) { return docs[p] ? clone(docs[p]) : null; },
    async set(p, data) { docs[p] = clone(data); save(); notify(p); },
    async update(p, data) {
      if (!docs[p]) throw { code: "invalid_argument", message: "Document does not exist" };
      docs[p] = Object.assign({}, docs[p], clone(data)); save(); notify(p);
    },
    async del(p) { delete docs[p]; save(); notify(p); },
    watch(c, cb) { const w = { c, cb }; watchers.add(w); setTimeout(() => cb(list(c), meta), 0); return () => watchers.delete(w); },
    watchDoc(p, cb) { const w = { p, cb }; watchers.add(w); setTimeout(() => cb(docs[p] ? clone(docs[p]) : null, meta), 0); return () => watchers.delete(w); },
    reset() {
      docs = seedDemo(); save();
      watchers.forEach((w) => w.c != null ? w.cb(list(w.c), meta) : w.cb(docs[w.p] ? clone(docs[w.p]) : null, meta));
    },
  };
}

// ---------- state ----------
const S = {
  booted: false, mode: null, store: null, user: null, downloads: null,
  uid: null, isOwner: false, myName: "", role: null, lc: null,
  viewAsLo: false, previewLc: "AUB", liveAvailable: false,

  if (e && e.code === "revoked") S.revoked = true;

}
function stopWatching() {

  if (kind === "vpa") {
    if (S.platform !== "firebase") { // access requests exist only in the claude.ai build
      watchColl("roster", "roster");
      watchColl("requests", "requests", (a, b) => (a.at || 0) - (b.at || 0));
    }
    watchColl("ledger", "ledger", (a, b) => (b.at || 0) - (a.at || 0));
    watchColl("decisions", "decisions");
    watchColl("audit", "audit", (a, b) => (b.at || 0) - (a.at || 0));
    offs.push(S.store.watch("subs", (list, meta) => {
      S.loIds = list.map((x) => x.id);
      S.loIds.forEach(watchItems);
      arrived(meta); changed();
    }, onErr));
    if (S.uid) watchItems(S.uid);
  }
  if (kind === "lo") watchItems(S.uid);
  if (kind === "none") {
    offs.push(S.store.watchDoc("requests/" + S.uid, (doc, meta) => { S.myRequest = doc; arrived(meta); changed(); }, onErr));
  }
  setTimeout(() => { if (!S.loaded) { S.stale = true; changed(); } }, 10000);
}

// ---------- boot ----------
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const LOGIN_DOMAIN = "lemsic-points.app";

/** The GitHub Pages build: one login per position, and the username is the role. */
async function bootFirebase(cfg) {
  S.platform = "firebase";
  let A, AU, F;
  try {
    [A, AU, F] = await Promise.all(["firebase-app.js", "firebase-auth.js", "firebase-firestore.js"].map((f) => import(FIREBASE_SDK + f)));
  } catch (e) {
    S.fatal = "Couldn't reach the sign-in service. Check your connection and reload the page.";
    return;
  }
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app), db = F.getFirestore(app);
  if (cfg.emulator) { // local testing only
    AU.connectAuthEmulator(auth, cfg.emulator.auth, { disableWarnings: true });
    F.connectFirestoreEmulator(db, cfg.emulator.host, cfg.emulator.firestorePort);
  }
  S.fb = { auth, AU };
  S.store = firestoreStore(db, F);
  S.mode = "live"; S.liveAvailable = true;
  await new Promise((resolve) => {
    let first = true;
    AU.onAuthStateChanged(auth, (u) => {
      stopWatching();
      S.viewAsLo = false; S.forms = {}; S.loCode = null;
      if (!u) { S.role = "signedout"; S.uid = null; S.myName = ""; }
      else {
        const name = String(u.email || "").toLowerCase().split("@")[0];
        S.uid = name; S.myName = positionLabel(name);
        if (name === "vpa") { S.role = "vpa"; subscribe("vpa"); }
        else if (/^lo\.[a-z0-9_-]+$/.test(name)) { S.role = "lo"; S.loCode = name.slice(3); subscribe("lo"); }
        else S.role = "unknown";
      }
      S.route = { name: "home" };
      if (first) { first = false; resolve(); } else changed();
    });
  });
}

/** vpa → "VPA", lo.aub → "LO · AUB" — positions, never people. */
function positionLabel(name) {
  if (!name) return "";
  if (name === "vpa" || name === "demo-vpa") return "VPA";
  const m = /^lo\.(.+)$/.exec(name);
  if (!m) return name;
  const c = S.committees.find((x) => x.id.toLowerCase() === m[1]);
  return "LO · " + (c ? c.id : m[1].toUpperCase());
}

async function boot() {
  const host = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  const fbConfig = !host && window.LEMSIC_FIREBASE && window.LEMSIC_FIREBASE.apiKey ? window.LEMSIC_FIREBASE : null;
  if (fbConfig) {
    await bootFirebase(fbConfig);
    if (S.store) { S.booted = true; const h0 = location.hash.slice(1); if (TOP.includes(h0)) S.route = { name: h0 }; render(); return; }
  }
  let db = null, user = null, downloads = null;
  if (host) {
    try { [db, user, downloads] = await Promise.all([host.use("db"), host.use("user"), host.use("downloads")]); } catch (e) { /* run the demo */ }
  }
  S.downloads = downloads;
  if (db && user) {
    const uid = await user.id();
    if (uid) {
      S.user = user; S.uid = uid; S.liveAvailable = true;
      S.isOwner = await user.isOwner();
      try { S.myName = (await user.me()).name || ""; } catch (e) { S.myName = ""; }
      S.store = liveStore(db); S.mode = "live";
      if (S.isOwner) {
        S.role = "vpa"; subscribe("vpa");
      } else {
        offs.push(S.store.watchDoc("roster/" + uid, (doc, meta) => {
          S.rosterMe = doc; arrived(meta);
          if (doc) { S.lc = doc.lc; if (S.role !== "lo") { S.role = "lo"; subscribe("lo"); S.route = { name: "home" }; } }
          else { if (S.role === "lo") S.route = { name: "home" }; S.role = "none"; subscribe("none"); }
          changed();
        }, onErr));
      }
    }
  }
  if (!S.store) startDemo();
  S.booted = true;
  const h = location.hash.slice(1);
  if (TOP.includes(h)) S.route = { name: h };
  render();
}

function startDemo() {
  S.store = localStore(); S.mode = "demo";

// ---------- people ----------
const profileQueue = new Set();
let profileTimer = null;
function personName(id) {
  if (!id) return "Someone";
  if (S.mode === "demo") return DEMO_PEOPLE[id] || "Someone";
  if (S.platform === "firebase") return positionLabel(id) || "Someone";
  if (id === S.uid && S.myName) return S.myName;
  const p = S.profiles[id];
  if (!p && S.user) {
    profileQueue.add(id);
    if (!profileTimer) profileTimer = setTimeout(async () => {
      const ids = Array.from(profileQueue); profileQueue.clear(); profileTimer = null;
      try { Object.assign(S.profiles, await S.user.profiles(ids)); } catch (e) { /* names stay generic */ }
      ids.forEach((x) => { if (!S.profiles[x]) S.profiles[x] = { name: "" }; });
      changed();
    }, 30);
  }
  return (p && p.name) || "Someone";
}

// ---------- derived data ----------
const isVpa = () => S.role === "vpa" && !S.viewAsLo;
const isLo = () => S.role === "lo" || (S.role === "vpa" && S.viewAsLo);
const myLc = () => {
  if (S.role === "vpa") return S.previewLc;
  if (S.loCode) { const c = S.committees.find((x) => x.id.toLowerCase() === S.loCode); return c ? c.id : S.loCode.toUpperCase(); }
  return S.lc;
};
const allItems = () => Object.entries(S.items).flatMap(([lo, list]) => list.map((x) => Object.assign({ lo }, x)));
const myItems = () => (S.items[S.uid] || []).map((x) => Object.assign({ lo: S.uid }, x)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
// Carries the owner's id along: a submission is addressed as subs/<lo>/items/<id>,
// so every control built from it needs both halves.
const findItem = (lo, id) => { const x = (S.items[lo] || []).find((y) => y.id === id); return x ? Object.assign({ lo }, x) : undefined; };
const committee = (code) => S.committees.find((c) => c.id === code);
const activeCommittees = () => S.committees.filter((c) => c.active !== false);
const activeRubric = () => S.rubric.filter((c) => c.active !== false);
const pendingItems = () => allItems().filter((x) => x.status === "pending").sort((a, b) => (a.submittedAt || 0) - (b.submittedAt || 0));
function balances() {
  const by = {};
  for (const e of S.ledger) {
    const b = by[e.memberId] || (by[e.memberId] = { memberId: e.memberId, name: e.name, lemsicId: e.lemsicId, lc: e.lc, carried: 0, earned: 0, total: 0, last: 0 });
    if (e.kind === "opening_balance") b.carried += e.pts; else b.earned += e.pts;
    b.total += e.pts; b.last = Math.max(b.last, e.at || 0);
  }
  return Object.values(by).sort((a, b) => b.total - a.total);
}

function problemsFor(sub, others) {
  const out = [], seen = new Set();
  const add = (level, msg) => { if (!seen.has(msg)) { seen.add(msg); out.push({ level, msg }); } };
  const rows = sub.rows || [];
  if (!String(sub.title || "").trim()) add("error", "The event needs a name.");
  if (!sub.date) add("error", "The event needs a date.");
  else if (sub.date > today()) add("error", "The event date is in the future.");
  if (!String(sub.location || "").trim()) add("error", "The event needs a location.");
  if (rows.length === 0) add("error", "Add at least one volunteer.");
  // Out-of-band points are flagged, never blocked: the LO reports what happened and the VPA judges it.
  rows.forEach((r) => {
    if (!r.loCanExceed && (r.pts < r.min || r.pts > r.max))
      add("warning", `${r.name}: “${r.catLabel}” allows ${r.min}–${r.max} pts, ${r.pts} entered. Explain it in the note or the VPA will likely adjust it.`);
  });
  const per = {};
  rows.forEach((r) => { per[r.cat] = per[r.cat] || { n: 0, r }; per[r.cat].n += 1; });
  Object.values(per).forEach(({ n, r }) => {
    if (r.maxPerEvent && n > r.maxPerEvent) add("error", `Only ${r.maxPerEvent} “${r.catLabel}” allowed per event — ${n} listed.`);
  });
  if (sub.date && others) {
    const ids = new Set(rows.map((r) => r.memberId));
    others.forEach((o) => {
      if (o.id === sub.id || o.date !== sub.date || !["pending", "approved"].includes(o.status)) return;
      (o.rows || []).forEach((r) => { if (ids.has(r.memberId)) add("warning", `${r.name} is already credited for ${fmtDate(sub.date)} on ${o.ref}.`); });
    });
  }
  return out;
}

// ---------- writes ----------
async function audit(action, summary) {
  if (!isVpa() && S.mode === "live") return; // the audit log is the VPA's; LOs can't write it
  await S.store.set("audit/" + newId("a"), { at: Date.now(), action, summary, by: S.uid });
}
function failMessage(e) {
  if (e instanceof UserError) return e.message;
  const code = e && e.code;
  if (code === "invalid_argument" || code === "permission-denied") return "That change wasn't allowed. You may not have permission for it — ask the VPA.";
  if (code === "unavailable" || code === "deadline-exceeded") return "Couldn't reach the database. Check the connection and try again.";
  if (code === "quota_exceeded") return "The database is full. Tell the VPA; nothing new can be saved until space is freed.";
  if (code === "resource_exhausted" || code === "resource-exhausted") return "Too many changes at once. Wait a moment and try again.";
  if (code === "revoked") return "Your access changed while the page was open.";
  return "That didn't save — the connection may have dropped. Try again.";
}
async function act(fn, okMessage) {
  if (S.busy) return;
  S.busy = true; changed();
  try { await fn(); if (okMessage) toast(okMessage); }
  catch (e) { toast(failMessage(e), true); }
  finally { S.busy = false; changed(); }
}
function toast(msg, bad) {
  S.toast = { msg, bad: !!bad, at: Date.now() };
  const at = S.toast.at;
  setTimeout(() => { if (S.toast && S.toast.at === at) { S.toast = null; changed(); } }, bad ? 6000 : 3500);
  changed();
}

// ---------- forms (values survive live re-renders) ----------
const fv = (form, name, fallback) => {
  const f = S.forms[form];

const opt = (value, label, current) => `<option value="${esc(value)}"${String(value) === String(current) ? " selected" : ""}>${esc(label)}</option>`;

          ${rows.map((r, i) => { const out = !r.loCanExceed && (r.pts < r.min || r.pts > r.max); return `<tr${out ? ` style="background:var(--flag-row)"` : ""}>
            <td>${who(r.name, r.lemsicId)}</td>

function vLedger() {

      ${bal.map((b) => `<tr><td>${who(b.name, b.lemsicId)}</td><td>${esc(b.lc)}</td><td class="num mono">${b.carried}</td><td class="num mono" style="color:var(--accent-2)">${b.earned >= 0 ? "+" : ""}${b.earned}</td><td class="num"><b>${b.total}</b></td></tr>`).join("")}</tbody></table></div>`;

      `<div class="scroll-x"><table><thead><tr><th>Local committee</th><th class="num">Members credited</th><th class="num">Carried</th><th class="num">This term</th><th class="num">Total</th></tr></thead><tbody>
      ${list.map((x) => `<tr><td><b>LC ${esc(x.lc)}</b><div class="sub">${esc((committee(x.lc) || {}).name || "")}</div></td><td class="num">${x.members.size}</td><td class="num mono">${x.carried}</td><td class="num mono">${x.earned}</td><td class="num"><b>${x.total}</b></td></tr>`).join("")}</tbody></table></div>`;

        <td class="num"><b style="${e.pts < 0 ? "color:var(--red)" : ""}">${e.pts > 0 ? "+" : ""}${e.pts}</b></td><td class="sub">${timeAgo(e.at)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  const cf = "corr";
  return head("Live points sheet", "Every row came from an approved submission, an import or a correction. Nothing is typed into it directly, so the history never changes underneath you.",
      (S.downloads || !window.claude) ? `<button class="btn sm" data-act="exportXlsx" ${dis()}>⇩ Download Excel workbook</button>` : "") +

      <div class="field"><label for="corr-m">Member</label><select class="inp" id="corr-m" data-form="${cf}" name="member">${opt("", "Choose…", "")}${S.members.map((m) => opt(m.id, m.name + " · " + m.lc, fv(cf, "member"))).join("")}</select></div>
      <div class="field"><label for="corr-p">Points (use a minus to take away)</label>${inp(cf, "pts", "", `id="corr-p" type="number" min="-999" max="999"`)}</div>

// ---------- shell ----------
function render() {
  const app = document.getElementById("app");
  if (!app) return;
  const focus = captureFocus();
  if (!S.booted) { app.innerHTML = `<div class="boot">Opening LeMSIC Points…</div>`; return; }
  if (S.fatal) { app.innerHTML = `<div class="boot">${esc(S.fatal)}</div>`; return; }
  if (S.mode === "live" && S.role == null) { app.innerHTML = `<div class="boot">Checking your access…</div>`; return; }
  if (S.role === "signedout") { app.innerHTML = vSignIn(); restoreFocus(focus); return; }
  if (S.role === "unknown") { app.innerHTML = vUnknown(); return; }

  let view;
  const r = S.route.name;
  if (S.role === "none") view = vNoAccess();
  else if (isVpa()) {
    view = r === "review" ? vReview() : r === "reviewSub" ? vReviewSub() : r === "submissions" ? vVpaSubmissions() : r === "sub" ? vSub()
      : r === "ledger" ? vLedger() : r === "members" ? vMembers() : r === "rubric" ? vRubric() : r === "access" ? (S.platform === "firebase" ? vCommittees() : vAccess()) : r === "audit" ? vAudit()
      : r === "edit" ? vSub() : vVpaHome();
  } else {
    if (VPA_ONLY.has(r)) S.route = { name: "home" };
    const rr = S.route.name;
    view = rr === "new" ? vNew() : rr === "edit" ? vEdit() : rr === "sub" ? vSub() : rr === "submissions" ? vLoSubmissions() : rr === "rubric" ? vRubric() : vLoHome();
  }

  const navKey = isVpa() ? "vpa" : "lo";
  const counts = isVpa() ? { review: pendingItems().length, access: S.requests.length } : { submissions: myItems().filter((x) => x.status === "returned").length };
  const curTop = { reviewSub: "review", sub: isVpa() ? "submissions" : "submissions", edit: isLo() ? "new" : "submissions" }[r] || r;
  const navItems = (S.role === "none" ? [] : NAV[navKey]).map((n) => (n[0] === "access" && S.platform === "firebase" ? [n[0], n[1], "Committees"] : n));
  const sideNav = navItems.map(([k, ic, label]) => `<button class="nav${curTop === k ? " on" : ""}" data-act="go" data-r="${k}"><span class="ic">${ic}</span>${esc(label)}${counts[k] ? `<span class="count">${counts[k]}</span>` : ""}</button>`).join("");
  const mobNav = navItems.map(([k, , label]) => `<button class="${curTop === k ? "on" : ""}" data-act="go" data-r="${k}">${esc(label)}${counts[k] ? ` · ${counts[k]}` : ""}</button>`).join("");
  const term = S.config && S.config.term;
  const whoLabel = isVpa() ? "VPA · National" : S.role === "none" ? "No committee yet" : "LO · LC " + (myLc() || "");
  const subtitle = isVpa() ? "National · VPA" : S.role === "none" ? "Waiting for access" : "LC " + (myLc() || "");
  const nameShown = S.mode === "demo" ? DEMO_PEOPLE[S.uid] : S.platform === "firebase" ? positionLabel(S.uid) : (S.myName || "You");

  const modeChip = `<span class="modechip ${S.mode}">${S.mode === "live" ? "Live" : "Demo"}</span>`;
  const demoSwitch = S.mode === "demo" ? `<div class="seg" role="group" aria-label="Try the demo as"><button class="${S.role === "lo" ? "on" : ""}" data-act="demoRole" data-v="lo">LO · LC AUB</button><button class="${S.role === "vpa" ? "on" : ""}" data-act="demoRole" data-v="vpa">VPA</button></div>` : "";
  const ownerSwitch = S.mode === "live" && S.role === "vpa" ? `<div class="seg" role="group" aria-label="View as"><button class="${!S.viewAsLo ? "on" : ""}" data-act="viewAs" data-v="vpa">VPA</button><button class="${S.viewAsLo ? "on" : ""}" data-act="viewAs" data-v="lo">Preview as LO</button></div>` : "";

  let banner = "";
  if (S.mode === "demo") banner = note("warn", `<b>Demo.</b> This runs only in your browser with example people and events. Nothing you do here reaches anyone else. <button class="linkbtn" data-act="resetDemo">Start the demo over</button>${S.liveAvailable ? ` · <button class="linkbtn" data-act="leaveDemo">Back to the live page</button>` : ""}`);
  else if (S.viewAsLo) banner = note("warn", `<b>Previewing the LO screens</b> for <select class="inp" style="display:inline-block;width:auto;padding:3px 8px;margin:0 4px" data-act-change="previewLc" aria-label="Committee to preview">${activeCommittees().map((c) => opt(c.id, "LC " + c.id, S.previewLc)).join("")}</select>. Anything you send here is real and lands in your own review queue.`);
  if (S.revoked) banner += note("warn", "Your access to this page changed while it was open. Reload to see what you can do now.");
  else if (S.stale) banner += note("info", "Can't reach the data yet — what's on screen may be out of date. It will catch up by itself once the connection returns.");

  app.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand"><div class="mark">LP</div><div><b>LeMSIC Points</b><span>${esc(subtitle)}</span></div></div>
      ${navItems.length ? `<div class="navgroup"><div class="navlabel">${isVpa() ? "VPA" : "Local Officer"}</div>${sideNav}</div>` : ""}
      <div class="side-foot"><div class="avatar">${esc(initials(nameShown))}</div><div><b>${esc(nameShown)}</b><small>${esc(whoLabel)}</small></div></div>
      ${S.platform === "firebase" ? `<button class="nav" data-act="signOut"><span class="ic">⏻</span>Sign out</button>` : ""}
    </aside>
    <div class="main">
      <div class="topbar"><div class="crumb"><b>LeMSIC Points</b></div><div class="spacer"></div>${modeChip}${demoSwitch}${ownerSwitch}${term ? `<div class="termsel"><span class="dot"></span>${esc(term)}</div>` : ""}</div>
      ${mobNav ? `<nav class="mnav" aria-label="Sections">${mobNav}</nav>` : ""}
      <div class="content" style="max-width:1460px">${banner ? `<div class="stack" style="margin-bottom:16px">${banner}</div>` : ""}${view}</div>
    </div>
  </div>${S.toast ? `<div class="toast${S.toast.bad ? " bad" : ""}" role="status">${esc(S.toast.msg)}</div>` : ""}`;
  restoreFocus(focus);
}
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.getAttribute || !el.getAttribute("data-form")) return null;
  return { form: el.getAttribute("data-form"), name: el.getAttribute("name"), start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.querySelector(`[data-form="${CSS.escape(f.form)}"][name="${CSS.escape(f.name)}"]`);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.start != null) el.setSelectionRange(f.start, f.end); } catch (e) { /* not a text field */ }
}

// ---------- events ----------
document.addEventListener("input", (e) => {
  const el = e.target;
  const form = el.getAttribute && el.getAttribute("data-form");
  if (!form) return;
  setForm(form, { [el.name]: el.type === "checkbox" ? el.checked : el.value });
  if (el.name === "cat" && el.getAttribute("data-defaults")) {
    const c = S.rubric.find((x) => x.id === el.value);
    if (c) { setForm(form, { pts: String(c.def) }); const p = document.querySelector(`[data-form="${CSS.escape(form)}"][name="pts"]`); if (p) p.value = c.def; }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.getAttribute && el.getAttribute("data-act-change") === "previewLc") { S.previewLc = el.value; changed(); return; }
  const form = el.getAttribute && el.getAttribute("data-form");
  if (form && (el.tagName === "SELECT" || el.type === "checkbox")) setForm(form, { [el.name]: el.type === "checkbox" ? el.checked : el.value });
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.getAttribute("data-act"), d = el.dataset;
  if (a === "go") { e.preventDefault(); go(d.r, { lo: d.lo, id: d.id, view: d.view }); return; }
  const fn = ACTIONS[a];
  if (fn) { e.preventDefault(); fn(d, el); }
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-submit]");
  if (!form) return;
  e.preventDefault();
  const fn = SUBMITS[form.getAttribute("data-submit")];
  if (fn) fn(form.dataset, form);
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TOP.includes(h) && S.route.name !== h) { S.route = { name: h }; render(); } });

// ---------- actions ----------
const itemPath = (lo, id) => "subs/" + lo + "/items/" + id;
async function touchMarker(lo, lc) { await S.store.set("subs/" + lo, { lc, updatedAt: Date.now() }); }

const SUBMITS = {
  async signIn() {
    const f = S.forms.signin || {};
    const username = String(f.username || "").trim().toLowerCase();
    const password = String(f.password || "");
    if (!username || !password) { S.signInError = "Enter your username and password."; render(); return; }
    if (S.busy) return;
    S.busy = true; S.signInError = null; render();
    try {
      const email = username.includes("@") ? username : username + "@" + LOGIN_DOMAIN;
      await S.fb.AU.signInWithEmailAndPassword(S.fb.auth, email, password);
      clearForm("signin");
    } catch (e) {
      const code = e && e.code;
      S.signInError = code === "auth/too-many-requests" ? "Too many attempts. Wait a few minutes, or ask the VPA to reset your password."
        : code === "auth/network-request-failed" ? "Couldn't reach the sign-in service. Check your connection."
        : "That username and password don't match.";
      setForm("signin", { password: "" });
    } finally { S.busy = false; render(); }
  },
  createDraft() {
    const f = S.forms.ev_new || {};
    act(async () => {
      const title = String(f.title || "").trim(), date = f.date || "", location = String(f.location || "").trim();
      if (!title || !date || !location) throw new UserError("Fill in the event name, date and location.");
      if (date > today()) throw new UserError("The event date is in the future.");
      const lc = myLc();
      if (!lc) throw new UserError("You don't have a committee yet.");
      const id = newId("s");
      const ym = date.slice(2, 4) + date.slice(5, 7);
      await S.store.set(itemPath(S.uid, id), { ref: `SUB-${ym}-${rand().toUpperCase().slice(0, 5)}`, lc, title, date, location, sc: f.sc || null, type: f.type || null, duration: f.duration || null, description: String(f.description || "").trim() || null, status: "draft", rows: [], by: S.uid, createdAt: Date.now(), updatedAt: Date.now() });
      await touchMarker(S.uid, lc);
      clearForm("ev_new");
      S.route = { name: "edit", lo: S.uid, id };
    });
  },
  saveEvent(d) {
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      const next = Object.assign({}, sub, { title: String(fv("ev_" + d.id, "title", sub.title)).trim(), date: fv("ev_" + d.id, "date", sub.date), location: String(fv("ev_" + d.id, "location", sub.location)).trim(), sc: fv("ev_" + d.id, "sc", sub.sc) || null, type: fv("ev_" + d.id, "type", sub.type) || null, duration: fv("ev_" + d.id, "duration", sub.duration) || null, description: String(fv("ev_" + d.id, "description", sub.description || "")).trim() || null, updatedAt: Date.now() });
      if (!next.title || !next.date || !next.location) throw new UserError("The event needs a name, a date and a location.");
      delete next.id; delete next.lo;
      await S.store.set(itemPath(d.lo, d.id), next);
      clearForm("ev_" + d.id);
    }, "Details saved.");
  },
  addRow(d) {
    const key = "row_" + d.id, f = S.forms[key] || {};
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      if (sub.status !== "draft" && sub.status !== "returned") throw new UserError("This submission is with the VPA and locked.");
      const m = S.members.find((x) => x.id === f.member); if (!m) throw new UserError("Choose a member.");
      if (m.lc !== sub.lc) throw new UserError("That member isn't in this committee.");
      const c = S.rubric.find((x) => x.id === f.cat); if (!c) throw new UserError("Choose a role from the rubric.");
      const pts = Number(f.pts);
      if (!Number.isInteger(pts) || pts < 0 || pts > 99) throw new UserError("Points must be a whole number from 0 to 99.");
      if ((sub.rows || []).some((r) => r.memberId === m.id)) throw new UserError(`${m.name} is already on this event — remove their row first to change it.`);
      const hours = f.hours === "" || f.hours == null ? null : Number(f.hours);
      const row = { memberId: m.id, name: m.name, lemsicId: m.lemsicId || null, cat: c.id, catLabel: c.label, min: c.min, max: c.max, maxPerEvent: c.maxPerEvent || null, loCanExceed: !!c.loCanExceed, hours: Number.isFinite(hours) ? hours : null, note: String(f.note || "").trim() || null, pts };
      const next = Object.assign({}, sub, { rows: (sub.rows || []).concat([row]), updatedAt: Date.now() });
      delete next.id; delete next.lo;
      await S.store.set(itemPath(d.lo, d.id), next);

  send(d) {
    const key = "send_" + d.id;
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      const probs = problemsFor(sub, myItems());
      if (probs.some((p) => p.level === "error")) throw new UserError("Fix the problems listed before sending.");
      await S.store.update(itemPath(d.lo, d.id), { status: "pending", submittedAt: Date.now(), updatedAt: Date.now(), loNote: String(fv(key, "loNote", sub.loNote || "")).trim() || null, vpaNote: null });
      await touchMarker(d.lo, sub.lc);
      clearForm(key);
      S.route = { name: "sub", lo: d.lo, id: d.id };
    }, "Sent to the VPA. It's locked now — you'll see the status change here.");
  },
  approve(d) {
    const key = "rev_" + d.id, f = S.forms[key] || {};
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      if (sub.status !== "pending") throw new UserError("That submission isn't waiting for review any more.");
      const rows = sub.rows || [];
      const decided = rows.map((r, i) => {
        const rejected = !!f["x" + i];
        const raw = f["p" + i] == null || f["p" + i] === "" ? Math.min(r.pts, r.max) : Number(f["p" + i]);
        if (!rejected && (!Number.isInteger(raw) || raw < 0)) throw new UserError(`${r.name}: points must be a whole number, 0 or more.`);
        if (!rejected && raw > r.max) throw new UserError(`${r.name}: “${r.catLabel}” tops out at ${r.max}.`);
        const pts = rejected ? 0 : raw;
        return { memberId: r.memberId, name: r.name, lemsicId: r.lemsicId || null, cat: r.cat, catLabel: r.catLabel, pts, state: rejected ? "rejected" : pts === r.pts ? "kept" : "edited", note: String(f["n" + i] || "").trim() || null };
      });
      // Each row's entry has a fixed id and is only ever created, never overwritten:
      // if an approval is interrupted and retried, the entries already written are
      // found and left alone, so nobody is paid twice. (In the GitHub build the
      // database refuses to overwrite a points entry anyway.)
      for (let i = 0; i < decided.length; i++) {
        const x = decided[i], path = "ledger/aw_" + d.id + "_" + i;
        if (x.pts <= 0 || await S.store.get(path)) continue;
        await S.store.set(path, { memberId: x.memberId, name: x.name, lemsicId: x.lemsicId, lc: sub.lc, kind: "award", pts: x.pts, reason: sub.title + " — " + x.catLabel, subId: d.id, subRef: sub.ref, cat: x.cat, at: Date.now() + i, by: S.uid });
      }
      const total = sum(decided, (x) => x.pts);
      await S.store.set("decisions/" + d.id, { lo: d.lo, subId: d.id, subRef: sub.ref, rows: decided, total, vpaNote: String(f.vnote || "").trim() || null, at: Date.now(), by: S.uid });
      await S.store.update(itemPath(d.lo, d.id), { status: "approved", decidedAt: Date.now() });
      await audit("submission.approved", `${sub.ref} approved for ${total} pts across ${decided.filter((x) => x.pts > 0).length} members`);
      clearForm(key);
      S.route = { name: "review" };
    }, "Approved. The points are on the sheet.");
  },
  returnSub(d) {
    const key = "ret_" + d.id;
    act(async () => {
      const reason = String(fv(key, "reason", "")).trim();
      if (!reason) throw new UserError("Say why you're sending it back — the LO reads this.");
      const sub = findItem(d.lo, d.id); if (!sub || sub.status !== "pending") throw new UserError("That submission isn't waiting for review.");
      await S.store.update(itemPath(d.lo, d.id), { status: "returned", vpaNote: reason, decidedAt: Date.now() });
      await audit("submission.returned", `${sub.ref} returned to the LO`);
      clearForm(key);
      S.route = { name: "review" };
    }, "Returned to the LO with your note.");
  },
  correction() {
    const f = S.forms.corr || {};
    act(async () => {
      const m = S.members.find((x) => x.id === f.member); if (!m) throw new UserError("Choose a member.");
      const pts = Number(f.pts);
      if (!Number.isInteger(pts) || pts === 0) throw new UserError("Enter a whole number of points other than zero.");
      const reason = String(f.reason || "").trim(); if (!reason) throw new UserError("A correction needs a reason.");
      await S.store.set("ledger/" + newId("c"), { memberId: m.id, name: m.name, lemsicId: m.lemsicId || null, lc: m.lc, kind: "correction", pts, reason, at: Date.now(), by: S.uid });
      await audit("ledger.correction", `${pts > 0 ? "+" : ""}${pts} pts for ${m.name}: ${reason}`);
      clearForm("corr");
    }, "Correction added.");
  },
  addMember() {
    const f = S.forms.member_new || {};
    act(async () => {
      const name = String(f.name || "").trim(), lc = f.lc, lemsicId = String(f.lemsicId || "").trim() || null;
      if (!name || !lc) throw new UserError("A member needs a name and a committee.");
      const clash = S.members.find((m) => (lemsicId && m.lemsicId === lemsicId) || (m.norm === norm(name) && m.lc === lc));
      if (clash) throw new UserError(`${clash.name} (LC ${clash.lc}) is already in the registry.`);
      await S.store.set("members/" + newId("m"), { name, norm: norm(name), lemsicId, lc, year: String(f.year || "").trim() || null, status: "active", createdAt: Date.now() });
      await audit("member.added", `Added ${name} to LC ${lc}`);
      clearForm("member_new");
    }, "Member added.");
  },
  addCat() {
    const f = S.forms.cat_new || {};
    act(async () => {
      const label = String(f.label || "").trim();
      const min = Number(f.min), def = Number(f.def), max = Number(f.max);
      if (!label) throw new UserError("A category needs a label.");
      if (![min, def, max].every(Number.isInteger) || min < 0 || !(min <= def && def <= max)) throw new UserError("Bands must be whole numbers with min ≤ suggested ≤ max.");
      const id = norm(label).replace(/ /g, "_").slice(0, 40) + "_" + rand().slice(0, 4);
      await S.store.set("rubric/" + id, { label, description: null, def, min, max, requires: null, maxPerEvent: null, loCanExceed: false, order: S.rubric.length, active: true });
      await audit("rubric.changed", `Added “${label}” (${min}–${max})`);
      clearForm("cat_new");
    }, "Category added.");

  addLc() {

    act(async () => {
      const code = String(f.code || "").trim(), name = String(f.name || "").trim();
      if (!code || !name) throw new UserError("A committee needs a short code and a full name.");
      if (!/^[A-Za-z0-9._-]{1,16}$/.test(code)) throw new UserError("Use letters, digits, dot, dash or underscore in the code.");
      if (S.committees.some((c) => c.id.toLowerCase() === code.toLowerCase())) throw new UserError(`LC ${code} already exists.`);
      await S.store.set("committees/" + code, { code, name, active: true });
      await audit("committee.created", `Added LC ${code} — ${name}`);
      clearForm("lc_new");
    }, "Committee added.");

  requestAccess() {

    act(async () => {
      if (!f.lc) throw new UserError("Choose your committee.");
      await S.store.set("requests/" + S.uid, { lc: f.lc, note: String(f.note || "").trim() || null, at: Date.now() });
      clearForm("req");

};

const ACTIONS = {
  delRow(d) {
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      const next = Object.assign({}, sub, { rows: (sub.rows || []).filter((_, i) => i !== Number(d.i)), updatedAt: Date.now() });
      delete next.id; delete next.lo;
      await S.store.set(itemPath(d.lo, d.id), next);
    });
  },
  delDraft(d) {
    act(async () => { await S.store.del(itemPath(d.lo, d.id)); S.route = { name: "home" }; }, "Draft deleted.");
  },
  saveCat(d) {
    const key = "rb_" + d.id;
    act(async () => {
      const c = S.rubric.find((x) => x.id === d.id); if (!c) return;
      const label = String(fv(key, "label", c.label)).trim();
      const min = Number(fv(key, "min", c.min)), def = Number(fv(key, "def", c.def)), max = Number(fv(key, "max", c.max));
      const per = fv(key, "maxPerEvent", c.maxPerEvent || "");
      const maxPerEvent = per === "" || per == null ? null : Number(per);
      if (!label) throw new UserError("A category needs a label.");
      if (![min, def, max].every(Number.isInteger) || min < 0 || !(min <= def && def <= max)) throw new UserError("Bands must be whole numbers with min ≤ suggested ≤ max.");
      if (maxPerEvent != null && (!Number.isInteger(maxPerEvent) || maxPerEvent < 1)) throw new UserError("Per-event limit must be 1 or more, or empty.");
      const next = Object.assign({}, c, { label, min, def, max, maxPerEvent, loCanExceed: !!fv(key, "loCanExceed", !!c.loCanExceed) });
      delete next.id;
      await S.store.set("rubric/" + d.id, next);
      await audit("rubric.changed", `“${label}” is now ${min}–${max} (suggested ${def})`);
      clearForm(key);
    }, "Rubric updated. Rows already submitted keep their old band.");
  },
  toggleCat(d) {
    act(async () => { const c = S.rubric.find((x) => x.id === d.id); if (!c) return; await S.store.update("rubric/" + d.id, { active: c.active === false }); await audit("rubric.changed", `${c.active === false ? "Restored" : "Retired"} “${c.label}”`); });
  },
  toggleMember(d) {

  },
  toggleLc(d) {

      await S.store.update("committees/" + d.id, { active: c.active === false });
      await audit(c.active === false ? "committee.restored" : "committee.archived", `LC ${c.id}`);
    });
  },
  approveReq(d) {

      const lc = fv("req_" + d.id, "lc", (S.requests.find((r) => r.id === d.id) || {}).lc);
      if (!lc) throw new UserError("Choose a committee.");

  },
  moveLo(d) {

  },
  demoRole(d) {

  openDemo() {

    Object.keys(itemWatch).forEach((k) => { try { itemWatch[k](); } catch (e) { /* closed */ } delete itemWatch[k]; });
    started.clear(); S.items = {};

  leaveDemo() { location.reload(); },
  loadSetup() {
    act(async () => {
      const el = document.getElementById("lemsic-seed");
      if (!el) throw new UserError("The starting setup isn't included in this page.");
      const docs = JSON.parse(el.textContent).docs;
      for (const [path, data] of Object.entries(docs)) {
        if (!(await S.store.get(path))) await S.store.set(path, data);
      }
      await audit("setup.loaded", "Loaded the starting term, committees and rubric");
    }, "Starting setup loaded.");
  },
  signOut() { if (S.fb) S.fb.AU.signOut(S.fb.auth); },
  async exportXlsx() {
    act(async () => {
      if (!window.XLSX) {
        await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = res; s.onerror = () => rej(new UserError("Couldn't load the Excel library. Check the connection and try again.")); document.head.appendChild(s); });
      }
      const X = window.XLSX, wb = X.utils.book_new();
      const ledger = [["Date", "Member", "LeMSIC ID", "LC", "Kind", "Points", "Reason", "Submission"]].concat(
        S.ledger.slice().reverse().map((e) => [new Date(e.at).toISOString().slice(0, 10), e.name, e.lemsicId || "", e.lc, e.kind === "opening_balance" ? "Carried forward" : e.kind === "correction" ? "Correction" : "Award", e.pts, e.reason, e.subRef || ""]));
      const totals = [["Member", "LeMSIC ID", "LC", "Carried forward", "This term", "Total"]].concat(balances().map((b) => [b.name, b.lemsicId || "", b.lc, b.carried, b.earned, b.total]));
      const lcs = {}; S.ledger.forEach((e) => { const x = lcs[e.lc] || (lcs[e.lc] = [e.lc, new Set(), 0, 0, 0]); x[1].add(e.memberId); if (e.kind === "opening_balance") x[2] += e.pts; else x[3] += e.pts; x[4] += e.pts; });
      const byLc = [["LC", "Members credited", "Carried forward", "This term", "Total"]].concat(Object.values(lcs).sort((a, b) => b[4] - a[4]).map((x) => [x[0], x[1].size, x[2], x[3], x[4]]));
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(totals), "Totals by member");
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(ledger), "Ledger");
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(byLc), "By LC");
      const buf = X.write(wb, { bookType: "xlsx", type: "array" });
      const filename = `LeMSIC Points ${today()}${S.mode === "demo" ? " (demo)" : ""}.xlsx`;
      if (!S.downloads) { // a normal website (the GitHub build): hand the browser the file
        const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
        const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        return;
      }
      try {
        await S.downloads.save({ filename, data: new Uint8Array(buf) });
      } catch (e) {
        if (e && e.code === "declined") return;
        throw new UserError(e && e.code === "extension_not_enabled" ? "Excel downloads aren't available in this view." : "The download didn't go through. Try again.");
      }
    });
  },
};

window.addEventListener("error", () => { /* keep the page usable; nothing to do here */ });
render();
boot();
})();
</script>
</body>
</html>
