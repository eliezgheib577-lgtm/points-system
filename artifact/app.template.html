(function () {
"use strict";

/* ===================================================================
   Where things live in the shared database, and who may touch them.
   The rules are declared at publish time and enforced by the platform,
   not by this page:

     committees, rubric, members, config   every LO reads · owner writes
     subs/<lo>/items/<id>                  that LO and the owner only
     requests/<person>                     that person and the owner only
     roster/<lo>                           that LO reads · owner writes
     ledger, decisions, audit              the owner (the VPA) only

   So an LO's screen can't show totals because the data never reaches
   their browser — not because a link is hidden.
   =================================================================== */

// ---------- small helpers ----------
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ESC[c]);
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const rand = () => Math.random().toString(36).slice(2, 9);
const newId = (prefix) => prefix + Date.now().toString(36) + rand();
const today = () => new Date().toISOString().slice(0, 10);
const first = (name) => String(name || "").split(/\s+/)[0];
const sum = (xs, f) => xs.reduce((a, x) => a + (f ? f(x) : x), 0);
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  return isNaN(d) ? "—" : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function span(ms) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return null;
  const m = Math.floor(s / 60); if (m < 60) return m + " min";
  const h = Math.floor(m / 60); if (h < 24) return h + " hour" + (h === 1 ? "" : "s");
  const d = Math.floor(h / 24); return d + " day" + (d === 1 ? "" : "s");
}
const timeAgo = (ms) => (ms ? (span(ms) ? span(ms) + " ago" : "just now") : "—");
const waited = (ms) => (ms ? (span(ms) || "under a minute") : "—");

  put("audit/a1", { at: now - 80 * DAY, action: "import.applied", summary: "Carried forward 463 pts for 8 members from the 2025/26 workbook", by: "demo-vpa" });
  put("audit/a2", { at: now - 35 * DAY, action: "submission.approved", summary: "SUB-2610-BLD01 approved for 38 pts across 5 members", by: "demo-vpa" });

  return d;

// ---------- storage: the shared db, or the visitor's own browser ----------
/** Google Firestore — the GitHub Pages build. F is the firebase-firestore module. */
function firestoreStore(db, F) {
  const rows = (snap) => snap.docs.map((x) => Object.assign({ id: x.id }, x.data()));
  const meta = (s) => ({ fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites });
  return {
    mode: "live",
    async get(p) { const s = await F.getDoc(F.doc(db, p)); return s.exists() ? s.data() : null; },
    set: (p, data) => F.setDoc(F.doc(db, p), data),
    update: (p, data) => F.updateDoc(F.doc(db, p), data),
    del: (p) => F.deleteDoc(F.doc(db, p)),
    watch: (c, cb, err) => F.onSnapshot(F.collection(db, c), (s) => cb(rows(s), meta(s)), err),
    watchDoc: (p, cb, err) => F.onSnapshot(F.doc(db, p), (s) => cb(s.exists() ? s.data() : null, meta(s)), err),
  };
}

function liveStore(db) {
  const rows = (snap) => snap.docs.filter((x) => x.exists).map((x) => Object.assign({ id: x.id }, x.data()));
  return {
    mode: "live",
    async get(p) { const s = await db.doc(p).get(); return s.exists ? s.data() : null; },
    set: (p, data) => db.doc(p).set(data),
    update: (p, data) => db.doc(p).update(data),
    del: (p) => db.doc(p).delete(),
    watch: (c, cb, err) => db.collection(c).onSnapshot((s) => cb(rows(s), s.metadata), err),
    watchDoc: (p, cb, err) => db.doc(p).onSnapshot((s) => cb(s.exists ? s.data() : null, s.metadata), err),
  };
}

function localStore() {
  // Bump this whenever the demo's example data changes: a browser holding an
  // older copy then starts fresh instead of showing stale names and committees.
  const KEY = "lemsic-points-demo-v3";
  try { ["lemsic-points-demo-v1", "lemsic-points-demo-v2"].forEach((k) => localStorage.removeItem(k)); } catch (e) { /* storage blocked */ }
  let docs = null;
  try { docs = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { docs = null; }
  if (!docs || typeof docs !== "object") docs = seedDemo();
  const watchers = new Set();
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const parent = (p) => p.split("/").slice(0, -1).join("/");
  const list = (c) => Object.keys(docs).filter((p) => parent(p) === c).sort().map((p) => Object.assign({ id: p.split("/").pop() }, clone(docs[p])));
  const meta = { fromCache: false, hasPendingWrites: false };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(docs)); } catch (e) { /* private window: the demo still works for this visit */ } }
  function notify(p) {
    const c = parent(p);
    watchers.forEach((w) => {
      if (w.c === c) w.cb(list(c), meta);
      if (w.p === p) w.cb(docs[p] ? clone(docs[p]) : null, meta);
    });
  }
  return {
    mode: "demo",
    async get(p) { return docs[p] ? clone(docs[p]) : null; },
    async set(p, data) { docs[p] = clone(data); save(); notify(p); },
    async update(p, data) {
      if (!docs[p]) throw { code: "invalid_argument", message: "Document does not exist" };
      docs[p] = Object.assign({}, docs[p], clone(data)); save(); notify(p);
    },
    async del(p) { delete docs[p]; save(); notify(p); },
    watch(c, cb) { const w = { c, cb }; watchers.add(w); setTimeout(() => cb(list(c), meta), 0); return () => watchers.delete(w); },
    watchDoc(p, cb) { const w = { p, cb }; watchers.add(w); setTimeout(() => cb(docs[p] ? clone(docs[p]) : null, meta), 0); return () => watchers.delete(w); },
    reset() {
      docs = seedDemo(); save();
      watchers.forEach((w) => w.c != null ? w.cb(list(w.c), meta) : w.cb(docs[w.p] ? clone(docs[w.p]) : null, meta));
    },
  };
}

// ---------- state ----------
const S = {
  booted: false, mode: null, store: null, user: null, downloads: null,
  uid: null, isOwner: false, myName: "", role: null, lc: null,
  viewAsLo: false, previewLc: "AUB", liveAvailable: false,
  config: null, committees: [], rubric: [], members: [], roster: [], rosterMe: undefined, requests: [], myRequest: undefined,
  items: {}, ledger: [], decisions: [], audit: [], imports: [], loIds: [], imp: null, mlist: null, rlist: null, give: { rows: [] }, editMember: null, clearProgress: null, resetProgress: null, backup: undefined, restore: null, undoArmed: null, excel: null, msAccount: null, xlBusy: false,
  profiles: {}, forms: {}, route: { name: "home" }, toast: null, busy: false,
  loaded: false, stale: false, revoked: false,
};

// ---------- subscriptions ----------
const offs = [];
const itemWatch = {};
let renderQueued = false;
function changed() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function onErr(e) {
  if (e && e.code === "revoked") S.revoked = true;
  (window.__lemsicErrors = window.__lemsicErrors || []).push((e && e.code) || "error");
  changed();
}
function stopWatching() {
  offs.splice(0).forEach((f) => { try { f(); } catch (e) { /* already closed */ } });
  Object.keys(itemWatch).forEach((k) => { try { itemWatch[k](); } catch (e) { /* closed */ } delete itemWatch[k]; });
  started.clear();
  Object.assign(S, { items: {}, ledger: [], decisions: [], audit: [], imports: [], imp: null, mlist: null, rlist: null, give: { rows: [] }, members: [], committees: [], rubric: [], roster: [], requests: [], loIds: [], config: null, loaded: false, stale: false });
}
function arrived(meta) { if (!meta || !meta.fromCache) { S.loaded = true; S.stale = false; } }
function watchColl(path, key, sortFn) {
  offs.push(S.store.watch(path, (list, meta) => { S[key] = sortFn ? list.sort(sortFn) : list; arrived(meta); changed(); }, onErr));
}
function watchItems(lo) {
  if (itemWatch[lo]) return;
  itemWatch[lo] = S.store.watch("subs/" + lo + "/items", (list, meta) => { S.items[lo] = list; arrived(meta); changed(); }, onErr);
}
const started = new Set();
function subscribe(kind) {
  if (started.has(kind)) return;
  started.add(kind);
  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
  if (!started.has("common")) {
    started.add("common");
    offs.push(S.store.watchDoc("config/app", (doc, meta) => { S.config = doc; arrived(meta); changed(); }, onErr));
    watchColl("committees", "committees", (a, b) => a.id.localeCompare(b.id));
    watchColl("rubric", "rubric", byOrder);
    watchColl("members", "members", (a, b) => String(a.name).localeCompare(String(b.name)));
  }
  if (kind === "vpa") {
    if (S.platform !== "firebase") { // access requests exist only in the claude.ai build
      watchColl("roster", "roster");
      watchColl("requests", "requests", (a, b) => (a.at || 0) - (b.at || 0));
    }
    offs.push(S.store.watch("ledger", (list, meta) => { S.ledger = list.sort((a, b) => (b.at || 0) - (a.at || 0)); arrived(meta); changed(); scheduleCatchUp(); scheduleBackup(); }, onErr));

/** The GitHub Pages build: one login per position, and the username is the role. */
async function bootFirebase(cfg) {
  S.platform = "firebase";
  let A, AU, F;
  try {
    [A, AU, F] = await Promise.all(["firebase-app.js", "firebase-auth.js", "firebase-firestore.js"].map((f) => import(FIREBASE_SDK + f)));
  } catch (e) {
    S.fatal = "Couldn't reach the sign-in service. Check your connection and reload the page.";
    return;
  }
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app), db = F.getFirestore(app);
  if (cfg.emulator) { // local testing only
    AU.connectAuthEmulator(auth, cfg.emulator.auth, { disableWarnings: true });
    F.connectFirestoreEmulator(db, cfg.emulator.host, cfg.emulator.firestorePort);
  }
  S.fb = { auth, AU };
  if (msConfig()) msal().then(changed).catch(() => null);
  S.store = firestoreStore(db, F);
  S.mode = "live"; S.liveAvailable = true;
  await new Promise((resolve) => {
    let first = true;
    AU.onAuthStateChanged(auth, (u) => {
      stopWatching();
      S.viewAsLo = false; S.forms = {}; S.loCode = null;
      if (!u) { S.role = "signedout"; S.uid = null; S.myName = ""; }
      else {
        const name = String(u.email || "").toLowerCase().split("@")[0];
        S.uid = name; S.myName = positionLabel(name);
        if (name === "vpa") { S.role = "vpa"; subscribe("vpa"); }
        else if (/^lo\.[a-z0-9_-]+$/.test(name)) { S.role = "lo"; S.loCode = name.slice(3); subscribe("lo"); }
        else S.role = "unknown";
      }
      S.route = { name: "home" };
      if (first) { first = false; resolve(); } else changed();
    });
  });
}

/** vpa → "VPA", lo.aub → "LO · AUB" — positions, never people. */

  const m = /^lo\.(.+)$/.exec(name);
  if (!m) return name;
  const c = S.committees.find((x) => x.id.toLowerCase() === m[1]);

function problemsFor(sub, others) {
  const out = [], seen = new Set();
  const add = (level, msg) => { if (!seen.has(msg)) { seen.add(msg); out.push({ level, msg }); } };
  const rows = sub.rows || [];
  if (!String(sub.title || "").trim()) add("error", "The event needs a name.");
  if (!sub.date) add("error", "The event needs a date.");
  else if (sub.date > today()) add("error", "The event date is in the future.");
  if (!String(sub.location || "").trim()) add("error", "The event needs a location.");
  if (rows.length === 0) add("error", "Add at least one volunteer.");
  // Out-of-band points are flagged, never blocked: the LO reports what happened and the VPA judges it.
  rows.forEach((r) => {
    if (!r.loCanExceed && (r.pts < r.min || r.pts > r.max))
      add("warning", `${r.name}: “${r.catLabel}” ${r.min === r.max ? `is worth ${r.min} pts` : `allows ${r.min}–${r.max} pts`}, ${r.pts} entered. Explain it in the note or the VPA will likely adjust it.`);
  });
  rows.forEach((r) => { const c = S.rubric.find((x) => x.id === r.cat); if (c && c.vpaOnly && sub.lc !== NATIONAL) add("warning", `${r.name}: “${r.catLabel}” is given by the VPA, not through a submission.`); });
  const per = {};
  rows.forEach((r) => { per[r.cat] = per[r.cat] || { n: 0, r }; per[r.cat].n += 1; });
  Object.values(per).forEach(({ n, r }) => {
    if (r.maxPerEvent && n > r.maxPerEvent) add("error", `Only ${r.maxPerEvent} “${r.catLabel}” allowed per event — ${n} listed.`);
  });
  if (sub.date && others) {
    const ids = new Set(rows.map((r) => r.memberId));
    others.forEach((o) => {
      if (o.id === sub.id || o.date !== sub.date || !["pending", "approved"].includes(o.status)) return;
      (o.rows || []).forEach((r) => { if (ids.has(r.memberId)) add("warning", `${r.name} is already credited for ${fmtDate(sub.date)} on ${o.ref}.`); });
    });
  }
  return out;
}

  if (code === "unavailable" || code === "deadline-exceeded") return "Couldn't reach the database. Check the connection and try again.";
  if (code === "quota_exceeded") return "The database is full. Tell the VPA; nothing new can be saved until space is freed.";
  if (code === "resource_exhausted" || code === "resource-exhausted") return "Too many changes at once. Wait a moment and try again.";

}

const idKey = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

function memberScore(m, q) {
  const nq = norm(q); if (!nq) return 0;
  let best = 0;
  const qid = idKey(q), mid = idKey(m.lemsicId);
  if (mid && qid) {
    if (mid === qid) best = 100;
    else if (mid.startsWith(qid)) best = 90;
    else if (/\d/.test(qid) && qid.length >= 2 && mid.includes(qid)) best = 80; // "0042" finds LEM-0042
  }
  const nm = m.norm || norm(m.name);
  if (!nm) return best;
  if (nm === nq) return Math.max(best, 98);
  if (nm.startsWith(nq)) return Math.max(best, 94);
  const qt = nq.split(" "), mt = nm.split(" ");

  if (qt.every((t) => mt.some((w) => w.startsWith(t)))) return Math.max(best, mt[0].startsWith(qt[0]) ? 88 : 85);
  if (nq.length >= 3 && nm.includes(nq)) return Math.max(best, 70);
  // A typo: "nasar" still finds Nassar, "khuory" still finds Khoury.
  let hit = 0;
  for (const t of qt) {
    if (mt.some((w) => w.startsWith(t))) hit += 1;

  cats.forEach((c) => { const g = c.group || ""; let x = out.find((y) => y.g === g); if (!x) out.push(x = { g, list: [] }); x.list.push(c); });
  return out;
}
/** The role list. LOs never see the types the VPA gives (positions); the VPA sees those first. */
function rubricOptions(cur, forVpa) {
  const cats = activeRubric().filter((c) => forVpa || !c.vpaOnly);
  const ordered = forVpa ? cats.filter((c) => c.vpaOnly).concat(cats.filter((c) => !c.vpaOnly)) : cats;
  return rubricGroups(ordered).map(({ g, list }) => { const o = list.map((c) => opt(c.id, `${c.label} (${band(c)})`, cur)).join(""); return g ? `<optgroup label="${esc(g)}">${o}</optgroup>` : o; }).join("");
}
/** On upload, a "Position" section is the VPA's to give. */
const vpaOnlyByDefault = (group) => /position/i.test(group || "");

/** The way back from each decision on a submission. */
function subUndo(sub, vpa) {
  const key = (k) => k + ":" + sub.id, attrs = `data-lo="${esc(sub.lo)}" data-id="${esc(sub.id)}"`;
  const box = (text, btn) => `<div class="card" style="margin-top:14px"><div class="card-b" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="sub" style="flex:1;min-width:220px">${text}</span>${btn}</div></div>`;
  if (!vpa && sub.status === "pending") return box("Sent by mistake, or need to change something? Take it back while the VPA hasn't decided yet. It becomes a draft again, and you send it when it's ready.", twiceBtn("recallSub", key("recall"), "Take it back", attrs));
  if (vpa && sub.status === "approved") return box("Approved by mistake? Undoing it takes these points back off the sheet with matching minus entries (nothing is deleted), and the submission waits for review again.", twiceBtn("undoApproval", key("unapprove"), "Undo this approval", attrs));
  if (vpa && sub.status === "returned") return box("Sent back by mistake? Take it back into your review queue.", twiceBtn("reopenSub", key("reopen"), "Back to pending review", attrs));
  return "";
}

/** Undo a member upload: whoever it added is removed (unless they already have points or are on a
 *  submission — they stay), and any LeMSIC ID it filled in is cleared again. */
async function undoMemberUpload(id) {
  const legacy = id === "legacy";
  const up = legacy ? null : S.imports.find((x) => x.id === id);
  if (!legacy && (!up || up.status === "reversed")) throw new UserError("That upload has already been undone.");
  const added = legacy ? S.members.filter((m) => m.via === "member list" && !m.uploadId).map((m) => m.id) : (up.added || []);
  const present = added.filter((mid) => S.members.some((m) => m.id === mid)), used = usedIds();
  const kept = present.filter((mid) => used.has(mid)), gone = present.filter((mid) => !used.has(mid));
  const jobs = gone.map((mid) => () => S.store.del("members/" + mid));
  ((up && up.filled) || []).forEach((f) => { const m = S.members.find((x) => x.id === f.id); if (m && idKey(m.lemsicId) === idKey(f.lemsicId)) jobs.push(() => S.store.update("members/" + f.id, { lemsicId: null })); });
  for (let i = 0; i < jobs.length; i += 5) await Promise.all(jobs.slice(i, i + 5).map((j) => j()));
  if (!legacy) await S.store.update("imports/" + id, { status: "reversed", reversedAt: Date.now(), kept: kept.length });
  await audit("members.upload.undone", `${legacy ? "An earlier member upload" : up.ref + " — " + up.filename} undone: ${gone.length} removed${kept.length ? `, ${kept.length} kept (already credited or on a submission)` : ""}`);
  toast(`Upload undone: ${gone.length} ${gone.length === 1 ? "member" : "members"} removed${kept.length ? ` · ${kept.length} kept because they already have points or are on a submission` : ""}.`);
}

/** Remove everyone (or one LC) at once. Whoever has points or is on a submission stays: the history needs them. */
async function clearMembers(lc) {
  const used = usedIds();
  const gone = S.members.filter((m) => (!lc || m.lc === lc) && !used.has(m.id));
  if (!gone.length) throw new UserError("Nobody to remove — everyone left has points or is on a submission.");
  const id = newId("clr"), ref = "CLR-" + today().slice(2, 4) + today().slice(5, 7) + "-" + rand().toUpperCase().slice(0, 5);

function pickMemberSheet(L, ix) {

/** What uploading the list would do. People already here are matched by LeMSIC ID, then by name within their LC. */
function memberListPlan(L) {
  const rows = L.sheets[L.sheetIx].rows.slice(L.header + 1);
  const byId = new Map(), byName = new Map();
  S.members.forEach((m) => { if (m.lemsicId) byId.set(idKey(m.lemsicId), m); byName.set((m.norm || norm(m.name)) + "|" + m.lc, m); });
  const seenId = new Set(), seenName = new Set();
  const plan = { add: [], fill: [], similar: [], same: 0, skipped: [], sample: [] };
  const cell = (r, i) => (i >= 0 ? String(r[i] ?? "").trim() : "");
  rows.forEach((r, i) => {
    r = r || [];
    const row = L.header + 2 + i;
    const name = cleanName([cell(r, L.col.name), cell(r, L.col.name2)].join(" "));
    const id = cell(r, L.col.id), lcRaw = cell(r, L.col.lc), year = cell(r, L.col.year) || null;
    if (!name && !id && !lcRaw) return; // a blank row
    const lc = lcFrom(lcRaw);
    if (plan.sample.length < 4) plan.sample.push({ name, id, lc, lcRaw });
    if (!name) { plan.skipped.push({ row, why: "no name" }); return; }
    if (!lc) { plan.skipped.push({ row, name, why: lcRaw ? `“${lcRaw}” isn't one of the LCs` : "no LC" }); return; }
    const k = idKey(id), nk = norm(name) + "|" + lc;
    if ((k && seenId.has(k)) || seenName.has(nk)) { plan.skipped.push({ row, name, why: "listed twice in this file" }); return; }
    if (k) seenId.add(k); seenName.add(nk);
    if (k && byId.has(k)) { plan.same++; return; }
    const named = byName.get(nk);
    if (named && (!named.lemsicId || !k)) { if (k) plan.fill.push({ m: named, lemsicId: id }); else plan.same++; return; }
    // Not the same ID, not the same name: maybe the same person spelled differently ("L. Khoury").
    const like = !named && S.members.find((m) => m.lc === lc && (!m.lemsicId || !k) && nameSimilarity(m.name, name) >= 0.75);
    const person = { row, name, id: id || null, lc, year };
    if (like) plan.similar.push(Object.assign(person, { m: like }));
    else plan.add.push(person);

}

async function applyGive() {
  const G = S.give; if (!G.rows.length) throw new UserError("Add someone first.");
  const title = String(fv("give_meta", "title", "")).trim() || null;
  const id = newId("awd"), ref = "AWD-" + today().slice(2, 4) + today().slice(5, 7) + "-" + rand().toUpperCase().slice(0, 5);

  // Fixed ids, only ever created: a retry after a dropped connection never gives anything twice.
  for (let i = 0; i < G.rows.length; i++) {

async function undoGive(id) {
  const rec = S.imports.find((x) => x.id === id);
  if (!rec || rec.kind !== "award" || rec.status === "reversed") throw new UserError("That batch has already been undone.");
  const entries = S.ledger.filter((e) => e.awardId === id && !e.reverses);

    const path = "ledger/rv_" + e.id;

  await audit("points.given.undone", `${rec.ref} undone: ${sum(entries, (e) => e.pts)} pts taken back`);
  syncSoon();
  toast(`${rec.ref} undone. Those points are off the sheet.`);
}

async function readRubricFile(file) {
  act(async () => {
    if (!file) return;
    const X = await loadXlsx();
    let wb;
    try { wb = X.read(await file.arrayBuffer(), { type: "array" }); } catch (e) { throw new UserError("That file couldn't be read as a spreadsheet. Use .xlsx, .xls or .csv."); }
    const sheets = wb.SheetNames.map((n) => ({ name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }) })).filter((x) => x.rows.length);
    if (!sheets.length) throw new UserError("That file has no rows in it.");
    S.rlist = { filename: file.name, sheets, keepOthers: false };
    const score = sheets.map((x) => x.rows.filter((r) => (r || []).some(isNum)).length);
    pickRubricSheet(S.rlist, score.indexOf(Math.max(...score)));
  });
}
function pickRubricSheet(R, ix) {
  R.sheetIx = ix;
  const rows = R.sheets[ix].rows;
  R.header = guessHeader(rows);
  const h = (rows[R.header] || []).map((x) => norm(x));
  const find = (re, not, skip) => h.findIndex((x, i) => re.test(x) && !(not && not.test(x)) && !(skip || []).includes(i));
  const label = [find(/^type$|^role$|^task$|^item$|^label$|^category$/), find(/type|role|task|activity|item|label|name/, /sheet|section|group|point|pts/)].find((i) => i >= 0) ?? -1;
  const group = find(/^sheet$|section|group|category|area|domain|tab/, null, [label]);
  const max = find(/\bmax\b|maximum/, /per event|per/);
  const pts = [find(/point|pts|score|value/, /\bmin\b|\bmax\b|per event/), find(/default|suggested/)].find((i) => i >= 0) ?? -1;
  R.col = { group, label: Math.max(0, label), pts, min: find(/\bmin\b|minimum/), max, per: find(/per event|max per|limit/), desc: find(/desc|definition|criteria|details|note/, null, [label, group]) };
}
const rubricKey = (group, label) => norm(group || "") + "|" + norm(label);
/** What uploading the rubric would do. A type is the same category as one already here when its section and name match. */
function rubricPlan(R) {
  const rows = R.sheets[R.sheetIx].rows.slice(R.header + 1);
  const cell = (r, i) => (i >= 0 ? r[i] : "");
  const items = [], skipped = [], seen = new Set();
  rows.forEach((r, i) => {
    r = r || [];
    const row = R.header + 2 + i;
    const label = String(cell(r, R.col.label) ?? "").replace(/\s+/g, " ").trim(), group = String(cell(r, R.col.group) ?? "").replace(/\s+/g, " ").trim() || null;
    const raw = cell(r, R.col.pts), rawMax = cell(r, R.col.max), rawMin = cell(r, R.col.min);
    if (!label && String(raw).trim() === "") return; // blank row
    if (!label) { skipped.push({ row, why: "no type" }); return; }
    const num = (v) => (String(v).trim() === "" ? null : isNum(v) ? toNum(v) : NaN);
    let def = num(raw), max = num(rawMax), min = num(rawMin);
    if (def == null && max != null) def = max;
    if (def == null || Number.isNaN(def) || !Number.isInteger(def) || def < 0) { skipped.push({ row, label, why: def == null ? "no points" : `“${raw}” isn't a whole number of points` }); return; }
    if (max == null || Number.isNaN(max)) max = def;
    if (min == null || Number.isNaN(min)) min = def; // no min column: the points are the floor
    if (!(min <= def && def <= max)) { min = Math.min(min, def); max = Math.max(max, def); }
    const key = rubricKey(group, label);
    if (seen.has(key)) { skipped.push({ row, label, why: "listed twice" }); return; }
    seen.add(key);
    const per = num(cell(r, R.col.per)), desc = String(cell(r, R.col.desc) ?? "").trim() || null;
    items.push({ group, label, def, min, max, maxPerEvent: Number.isInteger(per) && per > 0 ? per : null, description: desc, order: items.length });
  });
  const used = usedCats();
  items.forEach((x) => {
    const was = S.rubric.find((c) => rubricKey(c.group, c.label) === rubricKey(x.group, x.label)) || (!x.group ? null : S.rubric.find((c) => !c.group && norm(c.label) === norm(x.label)));
    x.was = was || null;
    x.state = !was ? "new" : was.def !== x.def || was.min !== x.min || was.max !== x.max || was.active === false ? "changed" : "same";
  });
  const matched = new Set(items.filter((x) => x.was).map((x) => x.was.id));
  const leftover = S.rubric.filter((c) => !matched.has(c.id) && c.active !== false).map((c) => Object.assign({}, c, { used: used.has(c.id) }));
  return { items, skipped, leftover, groups: new Set(items.map((x) => x.group || "")).size };
}
async function applyRubric() {
  const R = S.rlist; if (!R) return;
  const plan = rubricPlan(R);
  if (!plan.items.length) throw new UserError("There are no categories to use in that file.");
  // The whole rubric as it stands is kept first, so the upload can be undone exactly.
  const id = newId("rub"), ref = "RUB-" + today().slice(2, 4) + today().slice(5, 7) + "-" + rand().toUpperCase().slice(0, 5);
  const taken = new Set(S.rubric.map((c) => c.id)), created = [];
  plan.items.filter((x) => !x.was).forEach((x) => { let cid = norm((x.group || "") + " " + x.label).replace(/ /g, "_").slice(0, 50) || "cat"; while (taken.has(cid)) cid += "_" + rand().slice(0, 3); taken.add(cid); x.newId = cid; created.push(cid); });
  await S.store.set("imports/" + id, { kind: "rubric", ref, filename: R.filename, status: "applying", count: plan.items.length, at: Date.now(), by: S.uid, before: S.rubric.map((c) => Object.assign({}, c)), created });
  for (const x of plan.items) {
    const fields = { group: x.group, label: x.label, def: x.def, min: x.min, max: x.max, order: x.order, active: true, vpaOnly: x.was && typeof x.was.vpaOnly === "boolean" ? x.was.vpaOnly : vpaOnlyByDefault(x.group) };
    if (R.col.per >= 0) fields.maxPerEvent = x.maxPerEvent;
    if (R.col.desc >= 0) fields.description = x.description;
    if (x.was) await S.store.update("rubric/" + x.was.id, fields);
    else await S.store.set("rubric/" + x.newId, Object.assign({ description: null, requires: null, maxPerEvent: null, loCanExceed: false }, fields));
  }
  let removed = 0, retired = 0;
  if (!R.keepOthers) for (const c of plan.leftover) {
    if (c.used) { await S.store.update("rubric/" + c.id, { active: false }); retired++; }
    else { await S.store.del("rubric/" + c.id); removed++; }
  }
  await S.store.update("imports/" + id, { status: "applied" });
  await audit("rubric.uploaded", `${ref} — ${R.filename}: ${plan.items.length} categories${removed ? `, ${removed} old ones removed` : ""}${retired ? `, ${retired} retired` : ""}`);
  S.rlist = null;
  toast(`Rubric updated: ${plan.items.length} categories. LOs see it now. You can undo this.`);
}
async function undoRubric(id) {
  const rec = S.imports.find((x) => x.id === id);
  if (!rec || rec.kind !== "rubric" || rec.status === "reversed") throw new UserError("That rubric upload has already been undone.");
  const used = usedCats();
  for (const c of rec.before || []) { const data = Object.assign({}, c); delete data.id; delete data.used; await S.store.set("rubric/" + c.id, data); }
  for (const cid of rec.created || []) {
    if (!S.rubric.some((c) => c.id === cid)) continue;
    if (used.has(cid)) await S.store.update("rubric/" + cid, { active: false }); else await S.store.del("rubric/" + cid);
  }
  await S.store.update("imports/" + id, { status: "reversed", reversedAt: Date.now() });
  await audit("rubric.upload.undone", `${rec.ref} undone: the rubric is back as it was`);
  toast("Rubric upload undone. The rubric is back as it was.");
}

const cleanName = (n) => {

  if (!L.size || !R.size) return 0;

  for (const t of L) {
    if (R.has(t)) { shared += 1; continue; }
    for (const o of R) {
      if ((t.length === 1 && o.startsWith(t)) || (o.length === 1 && t.startsWith(o))) { shared += 0.5; break; }

function lcFrom(raw) {
  const r = norm(raw); if (!r) return null;
  const c = S.committees.find((x) => norm(x.id) === r || norm(x.name) === r || (r.length > 3 && norm(x.name).includes(r)) || r.split(" ").includes(norm(x.id)))

    // "LeMSIC ID" or "ID_to_email" — never a phone number.

/** Group the sheet's rows into people and suggest who each one is. */
function buildGroups(I) {

  const groups = new Map();

  rows.forEach((r, i) => {
    r = r || [];
    const name = String(r[I.col.name] ?? "").trim();
    const id = I.col.id >= 0 ? String(r[I.col.id] ?? "").trim() : "";
    if (!name && !id) return;
    const raw = r[I.col.pts];
    if (!isNum(raw)) { unreadable++; return; }
    const pts = toNum(raw);
    if (!Number.isInteger(pts)) fractional = true;
    const lcRaw = I.col.lc >= 0 ? String(r[I.col.lc] ?? "").trim() : "";
    const key = id ? "id:" + id.toLowerCase() : "nm:" + norm(cleanName(name)) + "|" + norm(lcRaw);
    const g = groups.get(key) || { key, names: [], id, lcRaw, lc: lcFrom(lcRaw), pts: 0, rows: [] };
    if (name && !g.names.includes(name)) g.names.push(name);

    if (!g.cands.length) {

async function readImportFile(file) {
  act(async () => {
    if (!file) return;
    const X = await loadXlsx();
    const buf = await file.arrayBuffer();
    const hash = await sha256(buf);
    let wb;
    try { wb = X.read(buf, { type: "array" }); } catch (e) { throw new UserError("That file couldn't be read as a spreadsheet. Use .xlsx, .xls or .csv."); }
    const sheets = wb.SheetNames.map((n) => ({ name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }) })).filter((x) => x.rows.length);
    if (!sheets.length) throw new UserError("That file has no rows in it.");
    const dup = sheetImports().find((x) => x.sha256 === hash && x.status === "applied");
    const resume = sheetImports().find((x) => x.sha256 === hash && x.status === "applying");
    S.imp = { step: dup ? "dup" : "map", dup, resume, filename: file.name, hash, sheets };
    const quality = sheets.map((x) => x.rows.filter((r) => (r || []).some(isNum)).length);

  });
}
async function applyImport() {

  const impId = I.resume ? I.resume.id : "imp_" + I.hash.slice(0, 12) + "_" + Date.now().toString(36);
  const ref = I.resume ? I.resume.ref : "IMP-" + today().slice(2, 4) + today().slice(5, 7) + "-" + rand().toUpperCase().slice(0, 5);
  const label = "Carried forward — " + I.filename;
  const write = async (path, data) => { if (!(await S.store.get(path))) await S.store.set(path, data); };
  // The record goes first, so an interrupted import can be found and finished.
  if (!I.resume) await S.store.set("imports/" + impId, { ref, filename: I.filename, sha256: I.hash, status: "applying", members: plan.people, created: plan.newOnes.size, total: plan.total, at: Date.now(), by: S.uid });
  I.progress = { done: 0, total: plan.newOnes.size + plan.totals.size }; changed();
  const memberFor = {};
  for (const [key, g] of plan.newOnes) {
    // Deterministic ids: a resumed import finds the members it already added.
    const id = "m_" + impId.slice(4, 16) + "_" + norm(g.name).replace(/ /g, "-").slice(0, 40);
    memberFor[key] = id;
    await write("members/" + id, { name: g.name, norm: norm(g.name), lemsicId: g.id || null, lc: g.lc || I.defaultLc, year: null, status: "active", createdAt: Date.now(), importId: impId });

    const m = S.members.find((x) => x.id === memberId) || (() => { const g = plan.newOnes.get(target.slice(4)); return { name: g.name, lemsicId: g.id || null, lc: g.lc || I.defaultLc }; })();
    if (pts !== 0) await write("ledger/ob_" + impId + "_" + memberId, { memberId, name: m.name, lemsicId: m.lemsicId || null, lc: m.lc, kind: "opening_balance", pts, reason: label, importId: impId, at: Date.now(), by: S.uid });

  await audit("import.applied", `${ref}: carried forward ${plan.total} pts for ${plan.people} members from ${I.filename}`);

}
async function undoImport(id) {

  // Nothing is deleted: each balance gets a matching negative entry, so the history shows both.
  const entries = S.ledger.filter((e) => e.importId === id && e.kind === "opening_balance" && !e.reverses);
  for (const e of entries) {
    const path = "ledger/rv_" + id + "_" + e.memberId;
    if (!(await S.store.get(path))) await S.store.set(path, { memberId: e.memberId, name: e.name, lemsicId: e.lemsicId || null, lc: e.lc, kind: "opening_balance", pts: -e.pts, reason: "Undo of " + imp.ref + " — " + imp.filename, importId: id, reverses: e.id, at: Date.now(), by: S.uid });
  }
  await S.store.update("imports/" + id, { status: "reversed", reversedAt: Date.now(), reversedBy: S.uid });
  await audit("import.reversed", `${imp.ref} undone: ${entries.length} starting balances reversed`);
  syncSoon();
}

/** The app writes exactly these sheets. Any other sheet in the workbook is left alone. */
function workbookSheets() {
  const ledger = [["Date", "Member", "LeMSIC ID", "LC", "Kind", "Points", "Reason", "Submission", "Event run by"]].concat(
    S.ledger.slice().reverse().map((e) => [new Date(e.at).toISOString().slice(0, 10), e.name, e.lemsicId || "", e.lc, e.kind === "opening_balance" ? "Carried forward" : e.kind === "correction" ? "Correction" : "Award", e.pts, e.reason, e.subRef || "", e.kind === "award" ? (e.source === "vpa" ? "VPA" : lcLabel(e.eventLc || e.lc)) : ""]));
  const totals = [["Member", "LeMSIC ID", "LC", "Carried forward", "This term", "Total"]].concat(balances().map((b) => [b.name, b.lemsicId || "", b.lc, b.carried, b.earned, b.total]));
  // Two columns to the right of the table: when this copy was written.
  const stamp = new Date().toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  while (totals.length < 2) totals.push(["", "", "", "", "", ""]);
  totals[0] = totals[0].concat(["", "Last updated"]);
  totals[1] = totals[1].concat(["", stamp + " · LeMSIC Points"]);
  const own = memberLcs(), lcs = {}; S.ledger.forEach((e) => { const lc = entryLc(e, own); const x = lcs[lc] || (lcs[lc] = [lc, new Set(), 0, 0, 0]); x[1].add(e.memberId); if (e.kind === "opening_balance") x[2] += e.pts; else x[3] += e.pts; x[4] += e.pts; });
  const byLc = [["LC", "Members credited", "Carried forward", "This term", "Total"]].concat(Object.values(lcs).sort((a, b) => b[4] - a[4]).map((x) => [x[0], x[1].size, x[2], x[3], x[4]]));
  return [["Totals by member", totals], ["Ledger", ledger], ["By LC", byLc]];
}
async function workbookBytes() {
  const X = await loadXlsx(), wb = X.utils.book_new();
  workbookSheets().forEach(([name, rows]) => X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rows), name));

/** Hand the viewer a file: the browser's own download on the GitHub site, claude.ai's save prompt in the test copy. */
async function saveFile(filename, bytes, mime) {
  if (!S.downloads) {
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

  try { await S.downloads.save({ filename, data: bytes }); }
  catch (e) {
    if (e && e.code === "declined") return;
    throw new UserError(e && e.code === "extension_not_enabled" ? "Downloads of that kind aren't available in this view." : "The download didn't go through. Try again.");
  }

// ---------- backups: a copy of everything, daily to OneDrive, any time as a download ----------
const BACKUP_FOLDER = "LeMSIC Points backups";
/** Every record the VPA can see, by its path. Restoring it puts back exactly these records. */
function backupDocs() {
  const docs = {};
  const put = (path, x) => { const d = Object.assign({}, x); delete d.id; delete d.lo; docs[path] = d; };
  if (S.config) docs["config/app"] = Object.assign({}, S.config);
  [["committees", S.committees], ["rubric", S.rubric], ["members", S.members], ["ledger", S.ledger], ["decisions", S.decisions], ["audit", S.audit], ["imports", S.imports]]
    .forEach(([c, list]) => list.forEach((x) => put(c + "/" + x.id, x)));
  if (S.platform !== "firebase") { S.roster.forEach((x) => put("roster/" + x.id, x)); S.requests.forEach((x) => put("requests/" + x.id, x)); }
  Object.entries(S.items).forEach(([lo, list]) => {
    if (!list.length) return;
    docs["subs/" + lo] = { lc: list[0].lc, updatedAt: Date.now() };
    list.forEach((x) => put("subs/" + lo + "/items/" + x.id, x));
  });
  if (S.excel) docs["settings/excel"] = Object.assign({}, S.excel);
  return docs;
}
const backupSection = (path) => { const c = path.split("/")[0]; return c === "subs" ? (path.split("/").length > 2 ? "submissions" : null) : c === "config" || c === "settings" ? "settings" : c; };
const SECTION_NAMES = { ledger: "points entries", members: "members", submissions: "submissions", decisions: "decisions", rubric: "rubric categories", committees: "LCs", imports: "uploads and imports", audit: "audit log entries", settings: "settings", roster: "LO access", requests: "access requests" };
function backupFile() {
  const docs = backupDocs(), counts = {};
  Object.keys(docs).forEach((p) => { const k = backupSection(p); if (k) counts[k] = (counts[k] || 0) + 1; });
  return { app: "LeMSIC Points", kind: "backup", format: 1, at: new Date().toISOString(), term: (S.config && S.config.term) || null, counts, docs };
}
/** Save today's backup next to the workbook. Once a day by itself (never replacing an earlier day's
 *  file); "Save now" replaces today's. Returns false when there's no Microsoft sign-in to use. */
async function backupToMicrosoft(interactive) {
  const xs = S.excel;
  if (!xs || !xs.itemId) throw new UserError("Connect the Excel workbook first — backups are saved in a folder next to it.");
  if (!S.loaded) return false;
  const token = await msToken(interactive); if (!token) return false;
  let folderId = xs.folderId;
  if (!folderId) {
    const item = await graph(token, "GET", `/drives/${xs.driveId}/items/${xs.itemId}`);
    folderId = item && item.parentReference && item.parentReference.id;
    if (!folderId) throw new UserError("Couldn't find the folder the workbook is in.");
    await S.store.update("settings/excel", { folderId });
  }
  const day = today(), name = `LeMSIC Points backup ${day}.json`, base = `/drives/${xs.driveId}/items/${folderId}:/${BACKUP_FOLDER}/${name}`;
  let exists = false;
  try { await graph(token, "GET", base); exists = true; } catch (e) { if (e.status !== 404) throw e; }
  let size = null;
  if (!exists || interactive) {
    const body = new TextEncoder().encode(JSON.stringify(backupFile()));
    size = body.length;
    await graph(token, "PUT", base + ":/content", body, { "Content-Type": "application/json" });
  }
  await S.store.set("settings/backup", { lastDay: day, lastName: name, lastAt: Date.now(), size, folder: BACKUP_FOLDER, lastError: null });
  return true;
}
let backupTimer = null, backupTriedDay = null;
/** The daily backup: the first time each day the VPA has the site open on a device signed in to Microsoft. */
function scheduleBackup() {
  if (backupTimer || !isVpa() || !msConfig() || !S.loaded || S.backup === undefined || !S.excel || !S.excel.itemId) return;
  const day = today();
  if ((S.backup && S.backup.lastDay === day) || backupTriedDay === day) return;
  backupTimer = setTimeout(async () => {
    backupTimer = null;
    if (backupTriedDay === day || (S.backup && S.backup.lastDay === day)) return;
    backupTriedDay = day;
    try { await msal(); } catch (e) { return; }
    if (!S.msAccount) return;
    try { await backupToMicrosoft(false); }
    catch (e) { await S.store.set("settings/backup", Object.assign({}, S.backup || {}, { lastError: (e && e.message) || "it didn't go through", lastErrorAt: Date.now() })).catch(() => null); }
  }, 5000);
}

async function readBackupFile(file) {
  act(async () => {
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { throw new UserError("That file isn't a LeMSIC Points backup."); }
    if (!data || data.app !== "LeMSIC Points" || data.kind !== "backup" || !data.docs || typeof data.docs !== "object") throw new UserError("That file isn't a LeMSIC Points backup.");
    const here = backupDocs(), missingBy = {};
    Object.keys(data.docs).forEach((p) => { if (here[p]) return; const k = backupSection(p) || "submissions"; (missingBy[k] = missingBy[k] || []).push(p); });
    // A submission's marker (subs/<lo>) goes with its submissions.

}
async function applyRestore() {
  const R = S.restore; if (!R) return;
  const paths = Object.keys(R.missingBy).filter((k) => R.pick[k] !== false).flatMap((k) => R.missingBy[k]);
  // Markers first, so a restored submission is found by the VPA's screens straight away.
  paths.sort((a, b) => a.split("/").length - b.split("/").length);
  for (let i = 0; i < paths.length; i += 5) {
    await Promise.all(paths.slice(i, i + 5).map((p) => S.store.set(p, R.docs[p])));
    R.progress = Math.min(paths.length, i + 5) + " of " + paths.length; changed();
  }
  await audit("backup.restored", `Restored ${paths.length} missing records from ${R.filename}`);
  S.restore = null;
  syncSoon();
  toast(`${paths.length} ${paths.length === 1 ? "record" : "records"} brought back from the backup.`);
}

// ---------- Excel: keeping the workbook on SharePoint / OneDrive up to date ----------
// Only the VPA's browser ever writes to it, straight after the VPA changes the
// ledger, using the VPA's own Microsoft 365 sign-in. No server is involved.
const MSAL_URL = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js";
const GRAPH = "https://graph.microsoft.com/v1.0";
const MS_SCOPES = ["Files.ReadWrite.All"];
let msalApp = null;
const msConfig = () => (window.LEMSIC_MICROSOFT && window.LEMSIC_MICROSOFT.clientId ? window.LEMSIC_MICROSOFT : null);
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new UserError("Couldn't load Microsoft's sign-in. Check the connection and try again.")); document.head.appendChild(el); });
}
async function msal() {
  if (msalApp) return msalApp;
  const cfg = msConfig();
  if (!cfg) throw new UserError("Microsoft 365 isn't set up for this site yet — see SETUP.md.");
  if (!window.msal) await loadScript(MSAL_URL);
  msalApp = new window.msal.PublicClientApplication({
    // The sign-in pop-up lands on a blank page next to this one (docs/ms-redirect.html),
    // which is the address registered in LeMSIC's Microsoft 365.
    auth: { clientId: cfg.clientId, authority: "https://login.microsoftonline.com/" + (cfg.tenantId || "organizations"), redirectUri: location.origin + location.pathname.replace(/[^/]*$/, "") + "ms-redirect.html" },
    cache: { cacheLocation: "localStorage" },
  });
  await msalApp.initialize();
  try { await msalApp.handleRedirectPromise(); } catch (e) { /* no redirect in progress */ }
  S.msAccount = msalApp.getAllAccounts()[0] || null;
  return msalApp;
}
/** A Graph token. interactive=false never opens a window: it is for the automatic update after an approval. */
async function msToken(interactive) {
  const app = await msal();
  let account = app.getAllAccounts()[0];
  if (!account) {
    if (!interactive) return null;
    account = (await app.loginPopup({ scopes: MS_SCOPES, prompt: "select_account" })).account;
  }
  S.msAccount = account;
  try { return (await app.acquireTokenSilent({ scopes: MS_SCOPES, account })).accessToken; }
  catch (e) { if (!interactive) return null; return (await app.acquireTokenPopup({ scopes: MS_SCOPES, account })).accessToken; }
}
async function graph(token, method, path, body, headers) {
  const binary = body instanceof ArrayBuffer || ArrayBuffer.isView(body);
  const r = await fetch(GRAPH + path, {
    method,
    headers: Object.assign({ Authorization: "Bearer " + token }, body !== undefined && !binary ? { "Content-Type": "application/json" } : {}, headers || {}),
    body: body === undefined ? undefined : binary ? body : JSON.stringify(body),
  });
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error.message; } catch (e) { /* no JSON body */ }
    const err = new UserError(r.status === 423 || r.status === 409 ? "The workbook is locked by someone editing it. It will be updated next time." : r.status === 401 || r.status === 403 ? "Microsoft refused access to the workbook. Sign in again, or check it's still shared with you." : r.status === 404 ? "The workbook wasn't found — it may have been moved or deleted." : "Microsoft said: " + (msg || r.statusText));
    err.status = r.status; throw err;
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}
const shareId = (url) => "u!" + btoa(unescape(encodeURIComponent(url))).replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
async function connectWorkbook(link) {
  const token = await msToken(true);
  let item;
  if (link) item = await graph(token, "GET", "/shares/" + shareId(link) + "/driveItem");
  else item = await graph(token, "PUT", "/me/drive/root:/LeMSIC Points/LeMSIC Points.xlsx:/content", new Uint8Array(await workbookBytes()));
  if (!/\.xlsx$/i.test(item.name || "")) throw new UserError("That link isn't to an Excel workbook (.xlsx).");
  await S.store.set("settings/excel", { driveId: item.parentReference.driveId, itemId: item.id, name: item.name, webUrl: item.webUrl || null, auto: true, connectedAt: Date.now(), lastSyncAt: null, lastError: null });
  await audit("excel.connected", `Keeping ${item.name} up to date`);
  await syncExcel(true);
}
let syncQueued = false;
/** Rewrite the app's three sheets in the workbook. Called after every change to the ledger. */
async function syncExcel(interactive) {
  const xs = S.excel || (await S.store.get("settings/excel"));
  if (!xs || !xs.itemId || !msConfig()) return;
  if (S.xlBusy) { syncQueued = true; return; }
  S.xlBusy = true; changed();
  let rows = 0;
  try {
    const token = await msToken(!!interactive);
    if (!token) throw new UserError("Sign in to Microsoft again on the Excel screen to keep the workbook up to date.");
    const base = `/drives/${encodeURIComponent(xs.driveId)}/items/${encodeURIComponent(xs.itemId)}/workbook`;
    const session = await graph(token, "POST", base + "/createSession", { persistChanges: true });
    const H = { "workbook-session-id": session.id };
    try {
      const existing = (await graph(token, "GET", base + "/worksheets", undefined, H)).value || [];
      for (const [name, data] of workbookSheets()) {
        const ws = existing.find((w) => w.name === name) || (await graph(token, "POST", base + "/worksheets/add", { name }, H));
        const wsPath = base + "/worksheets/" + encodeURIComponent(ws.id);
        // The app's sheets are kept protected (no password) so that someone typing in
        // the shared file is stopped, instead of losing their edit at the next update.
        const prot = await graph(token, "GET", wsPath + "/protection", undefined, H);
        if (prot && prot.protected) await graph(token, "POST", wsPath + "/protection/unprotect", {}, H);
        const used = await graph(token, "GET", wsPath + "/usedRange(valuesOnly=true)?$select=address", undefined, H);
        const addr = used && used.address ? String(used.address).split("!").pop() : "A1";
        await graph(token, "POST", wsPath + `/range(address='${addr}')/clear`, { applyTo: "Contents" }, H);
        const width = Math.max(...data.map((r) => r.length));
        for (let start = 0; start < data.length; start += 2000) {
          const chunk = data.slice(start, start + 2000).map((r) => Array.from({ length: width }, (_, i) => (r[i] == null ? "" : r[i])));
          await graph(token, "PATCH", wsPath + `/range(address='A${start + 1}:${colLetter(width - 1)}${start + chunk.length}')`, { values: chunk }, H);
        }
        await graph(token, "POST", wsPath + "/protection/protect", {}, H);
        rows += data.length - 1;
      }
    } finally {
      await graph(token, "POST", base + "/closeSession", {}, H).catch(() => null);
    }
    await S.store.update("settings/excel", { lastSyncAt: Date.now(), lastError: null, rows });
  } catch (e) {
    const msg = failMessage(e);
    await S.store.update("settings/excel", { lastError: msg, lastErrorAt: Date.now() }).catch(() => null);
    if (interactive) throw e; else toast("Excel wasn't updated: " + msg, true);
  } finally {
    S.xlBusy = false; changed();
    if (syncQueued) { syncQueued = false; syncExcel(false); }
  }
}
const lastLedgerChange = () => S.ledger.reduce((m, e) => Math.max(m, e.at || 0), 0);
/** Is the shared workbook missing any change? (Approved on a phone not signed in to Microsoft, a locked file, …) */
const excelBehind = () => !!(S.excel && S.excel.itemId && (!S.excel.lastSyncAt || S.excel.lastError || lastLedgerChange() > S.excel.lastSyncAt));
let catchUpTimer = null, triedFor = -1;
/** Whenever the VPA has the site open on a device signed in to Microsoft, bring the workbook up to date — once per change. */
function scheduleCatchUp() {
  if (catchUpTimer || !isVpa() || !msConfig() || !S.loaded) return;
  catchUpTimer = setTimeout(async () => {
    catchUpTimer = null;
    const latest = lastLedgerChange();
    if (!excelBehind() || S.xlBusy || triedFor === latest || S.excel.auto === false) return;
    triedFor = latest;
    try { await msal(); } catch (e) { return; }
    if (S.msAccount) syncExcel(false);
  }, 1500);
}
/** After the ledger changes: update the workbook in the background, without holding up the screen. */
function syncSoon() { if (S.excel && S.excel.itemId && S.excel.auto !== false && msConfig()) setTimeout(() => syncExcel(false), 50); }

// ---------- shell ----------
function render() {
  const app = document.getElementById("app");
  if (!app) return;
  const focus = captureFocus();
  if (!S.booted) { app.innerHTML = `<div class="boot">Opening LeMSIC Points…</div>`; return; }
  if (S.fatal) { app.innerHTML = `<div class="boot">${esc(S.fatal)}</div>`; return; }
  if (S.mode === "live" && S.role == null) { app.innerHTML = `<div class="boot">Checking your access…</div>`; return; }
  if (S.role === "signedout") { app.innerHTML = vSignIn(); restoreFocus(focus); return; }
  if (S.role === "unknown") { app.innerHTML = vUnknown(); return; }

  let view;
  const r = S.route.name;
  if (S.role === "none") view = vNoAccess();
  else if (isVpa()) {
    view = r === "review" ? vReview() : r === "reviewSub" ? vReviewSub() : r === "submissions" ? vVpaSubmissions() : r === "sub" ? vSub()
      : r === "give" ? vGive() : r === "ledger" ? vLedger() : r === "import" ? vImport() : r === "excel" ? vExcel() : r === "members" ? vMembers() : r === "rubric" ? vRubric() : r === "access" ? (S.platform === "firebase" ? vCommittees() : vAccess()) : r === "audit" ? vAudit()
      : r === "new" ? vNew() : r === "edit" ? (isOwnEvent(S.route.lo) ? vEdit() : vSub()) : vVpaHome();

  const term = S.config && S.config.term;

  const subtitle = isVpa() ? "National · VPA" : S.role === "none" ? "Waiting for access" : "LC " + (myLc() || "");
  const nameShown = S.mode === "demo" ? DEMO_PEOPLE[S.uid] : S.platform === "firebase" ? positionLabel(S.uid) : (S.myName || "You");

  const modeChip = `<span class="modechip ${S.mode}">${S.mode === "live" ? "Live" : "Demo"}</span>`;
  const xlChip = isVpa() && msConfig() && S.excel && S.excel.itemId

      <div class="content" style="max-width:1460px">${banner ? `<div class="stack" style="margin-bottom:16px">${banner}</div>` : ""}${view}</div>
    </div>
  </div>${S.toast ? `<div class="toast${S.toast.bad ? " bad" : ""}" role="status">${esc(S.toast.msg)}</div>` : ""}`;
  restoreFocus(focus);

function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.getAttribute || !el.getAttribute("data-form")) return null;
  return { form: el.getAttribute("data-form"), name: el.getAttribute("name"), start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.querySelector(`[data-form="${CSS.escape(f.form)}"][name="${CSS.escape(f.name)}"]`);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.start != null) el.setSelectionRange(f.start, f.end); } catch (e) { /* not a text field */ }
}

// ---------- events ----------
document.addEventListener("input", (e) => {
  const el = e.target;
  const form = el.getAttribute && el.getAttribute("data-form");
  if (!form) return;
  setForm(form, { [el.name]: el.type === "checkbox" ? el.checked : el.value });
  // Only the results are redrawn while typing, so the box keeps focus and the phone keyboard stays up.
  if (el.hasAttribute("data-picker")) { pickIx[form] = 0; refreshPick(form); return; }
  const live = el.getAttribute("data-live");
  if (live && LIVE[live]) { const box = document.getElementById(live); if (box) box.innerHTML = LIVE[live](); return; }
  if (el.name === "cat" && el.getAttribute("data-defaults")) {
    const c = S.rubric.find((x) => x.id === el.value);
    if (c) { setForm(form, { pts: String(c.def) }); const p = document.querySelector(`[data-form="${CSS.escape(form)}"][name="pts"]`); if (p) p.value = c.def; }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.getAttribute && el.getAttribute("data-act-file") === "importFile") { readImportFile(el.files && el.files[0]); return; }
  if (el.getAttribute && el.getAttribute("data-act-file") === "memberFile") { readMemberFile(el.files && el.files[0]); return; }
  if (el.getAttribute && el.getAttribute("data-act-file") === "rubricFile") { readRubricFile(el.files && el.files[0]); return; }
  if (el.getAttribute && el.getAttribute("data-act-file") === "backupFile") { readBackupFile(el.files && el.files[0]); el.value = ""; return; }
  const rsField = el.getAttribute && el.getAttribute("data-rs");
  if (rsField && S.restore) { S.restore.pick[rsField] = el.checked; changed(); return; }
  const rlField = el.getAttribute && el.getAttribute("data-rl");
  if (rlField && S.rlist) {
    if (rlField === "sheet") pickRubricSheet(S.rlist, Number(el.value));
    else if (rlField.startsWith("col.")) S.rlist.col[rlField.slice(4)] = Number(el.value);
    else if (rlField === "keepOthers") S.rlist.keepOthers = el.checked;
    changed(); return;
  }
  const mlField = el.getAttribute && el.getAttribute("data-ml");
  if (mlField && S.mlist) {
    const L = S.mlist;
    if (mlField === "sheet") pickMemberSheet(L, Number(el.value));
    else if (mlField.startsWith("col.")) L.col[mlField.slice(4)] = Number(el.value);
    else if (mlField === "similarNew") L.similarNew = el.checked;
    changed(); return;
  }
  const impField = el.getAttribute && el.getAttribute("data-imp");
  if (impField && S.imp) {
    const I = S.imp;
    if (impField === "sheet") pickSheet(I, Number(el.value));
    else if (impField === "header") { const n = Math.max(1, Math.min(Number(el.value) || 1, I.sheets[I.sheetIx].rows.length)); I.header = n - 1; I.col = guessColumns(I.sheets[I.sheetIx].rows[I.header] || []); }
    else if (impField.startsWith("col.")) I.col[impField.slice(4)] = Number(el.value);
    else if (impField === "dec") I.decisions[el.getAttribute("data-key")] = el.value;
    else if (impField === "defaultLc") I.defaultLc = el.value;
    changed(); return;
  }
  if (el.getAttribute && el.getAttribute("data-act-change") === "previewLc") { S.previewLc = el.value; changed(); return; }
  const form = el.getAttribute && el.getAttribute("data-form");
  if (form && (el.tagName === "SELECT" || el.type === "checkbox")) { setForm(form, { [el.name]: el.type === "checkbox" ? el.checked : el.value }); if (el.hasAttribute("data-rerender")) changed(); }
});
// In a member search box: ↓/↑ move through the matches, Enter picks one (and never submits the form), Esc clears.
document.addEventListener("keydown", (e) => {
  const form = e.target.getAttribute && e.target.getAttribute("data-picker");
  if (!form) return;
  const list = document.getElementById(form + "-list");
  const all = list ? Array.from(list.querySelectorAll(".pickopt")) : [];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!all.length) return;
    const at = Math.max(0, all.findIndex((x) => x.classList.contains("on")));
    pickIx[form] = e.key === "ArrowDown" ? Math.min(at + 1, all.length - 1) : Math.max(at - 1, 0);
    refreshPick(form);
  } else if (e.key === "Enter") {
    e.preventDefault();
    const on = list && (list.querySelector(".pickopt.on:not([disabled])") || list.querySelector(".pickopt:not([disabled])"));
    if (on) ACTIONS.pickMember(on.dataset);
  } else if (e.key === "Escape" && e.target.value) {
    e.preventDefault(); e.target.value = ""; setForm(form, { q: "" }); refreshPick(form);
  }
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.getAttribute("data-act"), d = el.dataset;
  if (a === "go") { e.preventDefault(); go(d.r, { lo: d.lo, id: d.id, view: d.view }); return; }
  const fn = ACTIONS[a];
  if (fn) { e.preventDefault(); fn(d, el); }
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-submit]");
  if (!form) return;
  e.preventDefault();
  const fn = SUBMITS[form.getAttribute("data-submit")];
  if (fn) fn(form.dataset, form);
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TOP.includes(h) && S.route.name !== h) { S.route = { name: h }; render(); } });

// ---------- actions ----------
const itemPath = (lo, id) => "subs/" + lo + "/items/" + id;
async function touchMarker(lo, lc) { await S.store.set("subs/" + lo, { lc, updatedAt: Date.now() }); }

/** Write an approval: one award per row with points, the decision, and the submission marked approved.
 *  Each award has a fixed id and is only ever created, never overwritten: an approval interrupted and
 *  retried finds the entries already written and leaves them, so nobody is paid twice (the GitHub
 *  build's rules refuse to overwrite a points entry anyway). An approval that was undone and is made
 *  again writes new entries (round 1, 2, …). */
async function writeApproval(d, sub, decided, vnote) {
  const round = sub.round || 0;
  for (let i = 0; i < decided.length; i++) {
    const x = decided[i], path = "ledger/aw_" + d.id + (round ? "_r" + round : "") + "_" + i;
    if (x.pts <= 0 || await S.store.get(path)) continue;
    await S.store.set(path, { memberId: x.memberId, name: x.name, lemsicId: x.lemsicId, lc: x.lc, eventLc: sub.lc, kind: "award", pts: x.pts, reason: sub.title + " — " + x.catLabel, subId: d.id, subRef: sub.ref, cat: x.cat, round, at: Date.now() + i, by: S.uid });
  }
  const total = sum(decided, (x) => x.pts);
  await S.store.set("decisions/" + d.id, { lo: d.lo, subId: d.id, subRef: sub.ref, rows: decided, total, vpaNote: vnote || null, at: Date.now(), by: S.uid });
  await S.store.update(itemPath(d.lo, d.id), { status: "approved", decidedAt: Date.now() });
  await audit("submission.approved", `${sub.ref}${sub.lc === NATIONAL ? " (the VPA's own event)" : ""} approved for ${total} pts across ${decided.filter((x) => x.pts > 0).length} members`);
  syncSoon();
}

const SUBMITS = {

    if (S.busy) return;
    S.busy = true; S.signInError = null; render();
    try {
      const email = username.includes("@") ? username : username + "@" + LOGIN_DOMAIN;
      await S.fb.AU.signInWithEmailAndPassword(S.fb.auth, email, password);
      clearForm("signin");
    } catch (e) {
      const code = e && e.code;
      S.signInError = code === "auth/too-many-requests" ? "Too many attempts. Wait a few minutes, or ask the VPA to reset your password."
        : code === "auth/network-request-failed" ? "Couldn't reach the sign-in service. Check your connection."
        : "That username and password don't match.";
      setForm("signin", { password: "" });
    } finally { S.busy = false; render(); }
  },

  saveEvent(d) {

  addRow(d) {
    const key = "row_" + d.id, f = S.forms[key] || {};

      if (c.vpaOnly && !isVpa()) throw new UserError(`“${c.label}” is given by the VPA, not through a submission.`);
      const pts = Number(f.pts);
      if (!Number.isInteger(pts) || pts < 0 || pts > 99) throw new UserError("Points must be a whole number from 0 to 99.");
      if ((sub.rows || []).some((r) => r.memberId === m.id)) throw new UserError(`${m.name} is already on this event — remove their row first to change it.`);
      const hours = f.hours === "" || f.hours == null ? null : Number(f.hours);
      const row = { memberId: m.id, name: m.name, lemsicId: m.lemsicId || null, lc: m.lc, cat: c.id, catLabel: c.label, min: c.min, max: c.max, maxPerEvent: c.maxPerEvent || null, loCanExceed: !!c.loCanExceed, hours: Number.isFinite(hours) ? hours : null, note: String(f.note || "").trim() || null, pts };
      const next = Object.assign({}, sub, { rows: (sub.rows || []).concat([row]), updatedAt: Date.now() });

      await S.store.update(itemPath(d.lo, d.id), { status: "pending", submittedAt: Date.now(), updatedAt: Date.now(), loNote: String(fv(key, "loNote", sub.loNote || "")).trim() || null, vpaNote: null });

  approve(d) {

    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      if (sub.status !== "pending") throw new UserError("That submission isn't waiting for review any more.");
      const rows = sub.rows || [], lcs = memberLcs();
      const decided = rows.map((r, i) => {
        const rejected = !!f["x" + i];
        const raw = f["p" + i] == null || f["p" + i] === "" ? Math.min(r.pts, r.max) : Number(f["p" + i]);
        if (!rejected && (!Number.isInteger(raw) || raw < 0)) throw new UserError(`${r.name}: points must be a whole number, 0 or more.`);
        if (!rejected && raw > r.max) throw new UserError(`${r.name}: “${r.catLabel}” tops out at ${r.max}.`);
        const pts = rejected ? 0 : raw;
        return { memberId: r.memberId, name: r.name, lemsicId: r.lemsicId || null, lc: lcs[r.memberId] || r.lc || sub.lc, cat: r.cat, catLabel: r.catLabel, pts, state: rejected ? "rejected" : pts === r.pts ? "kept" : "edited", note: String(f["n" + i] || "").trim() || null };
      });

  },
  returnSub(d) {

  },
  correction() {
    const f = S.forms.corr || {};
    act(async () => {
      const m = S.members.find((x) => x.id === f.member); if (!m) throw new UserError("Search for the member and click their name.");
      const pts = Number(f.pts);
      if (!Number.isInteger(pts) || pts === 0) throw new UserError("Enter a whole number of points other than zero.");

  addMember() {
    const f = S.forms.member_new || {};
    act(async () => {
      const name = String(f.name || "").trim(), lc = f.lc, lemsicId = String(f.lemsicId || "").trim() || null;
      if (!name || !lc) throw new UserError("A member needs a name and a committee.");

      if (clash) throw new UserError(clash.lemsicId && lemsicId && idKey(clash.lemsicId) === idKey(lemsicId) ? `LeMSIC ID ${lemsicId} already belongs to ${clash.name} (LC ${clash.lc}).` : `${clash.name} (LC ${clash.lc}) is already in the registry.`);

  addGiveRow() {

    const c = S.rubric.find((x) => x.id === f.cat); if (!c) { toast("Choose the type from the rubric.", true); return; }

  saveMember(d) {
    const key = "member_edit_" + d.id;
    act(async () => {
      const m = S.members.find((x) => x.id === d.id); if (!m) throw new UserError("That member is gone.");
      const name = String(fv(key, "name", m.name)).trim(), lc = fv(key, "lc", m.lc), year = String(fv(key, "year", m.year || "")).trim() || null;
      const lemsicId = String(fv(key, "lemsicId", m.lemsicId || "")).trim() || null;
      if (!name || !lc) throw new UserError("A member needs a name and a committee.");
      const clash = lemsicId && S.members.find((x) => x.id !== m.id && idKey(x.lemsicId) === idKey(lemsicId));
      if (clash) throw new UserError(`LeMSIC ID ${lemsicId} already belongs to ${clash.name} (LC ${clash.lc}).`);
      await S.store.update("members/" + m.id, { name, norm: norm(name), lemsicId, lc, year });
      const what = [name !== m.name && `name “${m.name}” → “${name}”`, (lemsicId || "") !== (m.lemsicId || "") && `ID ${m.lemsicId || "—"} → ${lemsicId || "—"}`, lc !== m.lc && `LC ${m.lc} → ${lc}`].filter(Boolean);

  addCat() {

const ACTIONS = {
  approveOwn(d) {
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub || !isOwnEvent(d.lo)) throw new UserError("That event is gone.");
      if (sub.status !== "draft" && sub.status !== "returned") throw new UserError("That event is already on the points sheet.");
      if (problemsFor(sub, allItems()).some((p) => p.level === "error")) throw new UserError("Fix the problems listed first.");
      const lcs = memberLcs();
      const decided = (sub.rows || []).map((r) => ({ memberId: r.memberId, name: r.name, lemsicId: r.lemsicId || null, lc: lcs[r.memberId] || r.lc || null, cat: r.cat, catLabel: r.catLabel, pts: r.pts, state: "kept", note: null }));
      await S.store.update(itemPath(d.lo, d.id), { status: "pending", submittedAt: Date.now(), updatedAt: Date.now() });
      await writeApproval(d, Object.assign({}, sub, { status: "pending" }), decided, null);
      S.route = { name: "sub", lo: d.lo, id: d.id };
    }, "Approved. The points are on the sheet.");
  },

  delRow(d) {
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");

      await S.store.set(itemPath(d.lo, d.id), next);

  },
  delDraft(d) {
    act(async () => { await S.store.del(itemPath(d.lo, d.id)); S.route = { name: "home" }; }, "Draft deleted.");

  saveCat(d) {

      if (![min, def, max].every(Number.isInteger) || min < 0 || !(min <= def && def <= max)) throw new UserError("Bands must be whole numbers with min ≤ suggested ≤ max.");
      if (maxPerEvent != null && (!Number.isInteger(maxPerEvent) || maxPerEvent < 1)) throw new UserError("Per-event limit must be 1 or more, or empty.");
      const next = Object.assign({}, c, { label, min, def, max, maxPerEvent, loCanExceed: !!fv(key, "loCanExceed", !!c.loCanExceed), vpaOnly: !!fv(key, "vpaOnly", !!c.vpaOnly) });

  undoClear(d) { if (confirmTwice("unclear:" + d.id)) act(() => undoClear(d.id)); },
  memberUploadUndo(d) { if (confirmTwice("upl:" + d.id)) act(() => undoMemberUpload(d.id)); },
  editMember(d) { S.editMember = d.id; clearForm("member_edit_" + d.id); window.scrollTo(0, 0); changed(); },
  editMemberClose() { S.editMember = null; changed(); },
  deleteMember(d) {
    if (!confirmTwice("delm:" + d.id)) return;
    act(async () => {
      const m = S.members.find((x) => x.id === d.id); if (!m) return;
      if (memberInUse(m.id)) throw new UserError(`${m.name} has points or is on a submission — mark them alumni instead.`);
      await S.store.del("members/" + m.id);
      await audit("member.deleted", `Deleted ${m.name} (LC ${m.lc})`);
      S.editMember = null;
    }, "Member deleted.");
  },
  recallSub(d) {
    if (!confirmTwice("recall:" + d.id)) return;
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub) throw new UserError("That submission is gone.");
      if (sub.status !== "pending") throw new UserError("The VPA has already decided on it, so it can't be taken back.");
      await S.store.update(itemPath(d.lo, d.id), { status: "draft", recalledAt: Date.now(), updatedAt: Date.now() });
      S.route = { name: "edit", lo: d.lo, id: d.id };
    }, "Taken back. It's a draft again — change what you need and send it.");
  },
  undoApproval(d) {
    if (!confirmTwice("unapprove:" + d.id)) return;
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub || sub.status !== "approved") throw new UserError("That submission isn't approved.");
      const round = sub.round || 0;
      // Nothing is deleted: each award gets a matching minus entry, so the history shows both.
      const awards = S.ledger.filter((e) => e.subId === d.id && e.kind === "award" && !e.reverses && (e.round || 0) === round);
      for (const e of awards) {
        const path = "ledger/rv_" + e.id;
        if (!(await S.store.get(path))) await S.store.set(path, { memberId: e.memberId, name: e.name, lemsicId: e.lemsicId || null, lc: e.lc, eventLc: e.eventLc || null, kind: "award", pts: -e.pts, reason: "Approval undone — " + sub.ref, subId: d.id, subRef: sub.ref, reverses: e.id, round, at: Date.now(), by: S.uid });
      }
      await S.store.update("decisions/" + d.id, { undone: true, undoneAt: Date.now() });
      const own = isOwnEvent(d.lo);
      await S.store.update(itemPath(d.lo, d.id), { status: own ? "draft" : "pending", round: round + 1, reopenedAt: Date.now() });
      await audit("submission.unapproved", `${sub.ref}: approval undone, ${sum(awards, (e) => e.pts)} pts taken back`);
      S.route = { name: own ? "edit" : "reviewSub", lo: d.lo, id: d.id };
      syncSoon();
    }, isOwnEvent(d.lo) ? "Approval undone. The points are off the sheet and the event is a draft again." : "Approval undone. The points are off the sheet and it's back in your review queue.");
  },
  reopenSub(d) {
    if (!confirmTwice("reopen:" + d.id)) return;
    act(async () => {
      const sub = findItem(d.lo, d.id); if (!sub || sub.status !== "returned") throw new UserError("That submission isn't with the LO.");
      await S.store.update(itemPath(d.lo, d.id), { status: "pending", vpaNote: null, reopenedAt: Date.now() });
      await audit("submission.reopened", `${sub.ref} taken back from the LO for review`);
      S.route = { name: "reviewSub", lo: d.lo, id: d.id };
    }, "Back in your review queue.");
  },
  undoCorrection(d) {
    if (!confirmTwice("corr:" + d.id)) return;
    act(async () => {
      const e = S.ledger.find((x) => x.id === d.id); if (!e || e.kind !== "correction") return;
      if (reversed(e)) throw new UserError("That correction has already been undone.");
      await S.store.set("ledger/rv_" + e.id, { memberId: e.memberId, name: e.name, lemsicId: e.lemsicId || null, lc: e.lc, kind: "correction", pts: -e.pts, reason: "Undo of a correction — " + e.reason, reverses: e.id, at: Date.now(), by: S.uid });
      await audit("ledger.correction.undone", `${e.pts > 0 ? "−" : "+"}${Math.abs(e.pts)} pts for ${e.name}: undid “${e.reason}”`);
      syncSoon();
    }, "Correction undone.");
  },
  memberListApply() { act(applyMemberList, null); },
  toggleMember(d) {
    act(async () => { const m = S.members.find((x) => x.id === d.id); if (!m) return; await S.store.update("members/" + d.id, { status: m.status === "alumni" ? "active" : "alumni" }); });
  },
  toggleLc(d) {
    act(async () => {
      const c = S.committees.find((x) => x.id === d.id); if (!c) return;
      if (c.active !== false && S.roster.some((r) => r.lc === c.id)) throw new UserError("Move or remove this committee's Local Officers first — archiving it would leave them with nowhere to submit.");
      await S.store.update("committees/" + d.id, { active: c.active === false });
      await audit(c.active === false ? "committee.restored" : "committee.archived", `LC ${c.id}`);
    });
  },
  approveReq(d) {
    act(async () => {
      const lc = fv("req_" + d.id, "lc", (S.requests.find((r) => r.id === d.id) || {}).lc);
      if (!lc) throw new UserError("Choose a committee.");
      await S.store.set("roster/" + d.id, { lc, approvedAt: Date.now(), by: S.uid });
      await S.store.del("requests/" + d.id);
      await audit("access.granted", `${personName(d.id)} can now submit for LC ${lc}`);
      clearForm("req_" + d.id);
    }, "Approved. They can submit straight away.");
  },
  declineReq(d) {
    act(async () => { await S.store.del("requests/" + d.id); await audit("access.declined", `Declined a request from ${personName(d.id)}`); });
  },
  moveLo(d) {
    act(async () => {
      const r = S.roster.find((x) => x.id === d.id); if (!r) return;
      const lc = fv("ros_" + d.id, "lc", r.lc);
      const next = Object.assign({}, r, { lc }); delete next.id;
      await S.store.set("roster/" + d.id, next);
      await audit("access.moved", `${personName(d.id)} now submits for LC ${lc}`);
      clearForm("ros_" + d.id);
    }, "Committee changed.");
  },
  removeLo(d) {
    act(async () => { await S.store.del("roster/" + d.id); await audit("access.removed", `${personName(d.id)} no longer has a committee`); }, "Removed. Take them off the Share menu too to shut them out completely.");
  },
  demoRole(d) {
    if (S.mode !== "demo") return;
    if (d.v === "vpa") { S.role = "vpa"; S.uid = "demo-vpa"; }
    else { S.role = "lo"; S.uid = "demo-lo-aub"; S.lc = "AUB"; }
    S.myName = DEMO_PEOPLE[S.uid]; S.forms = {};
    go("home");
  },
  viewAs(d) { S.viewAsLo = d.v === "lo"; S.forms = {}; go("home"); },
  resetDemo() { if (S.store && S.store.reset) { S.store.reset(); S.forms = {}; toast("The demo is back to how it started."); go("home"); } },
  openDemo() {
    offs.splice(0).forEach((f) => { try { f(); } catch (e) { /* already closed */ } });
    Object.keys(itemWatch).forEach((k) => { try { itemWatch[k](); } catch (e) { /* closed */ } delete itemWatch[k]; });
    started.clear(); S.items = {};
    S.liveRole = S.role;
    startDemo(); S.forms = {}; go("home");
  },
  leaveDemo() { location.reload(); },
  impReset() { S.imp = null; changed(); },
  msConnect() { act(async () => { const app = await msal(); const r = await app.loginPopup({ scopes: MS_SCOPES, prompt: "select_account" }); S.msAccount = r.account; }, "Signed in to Microsoft."); },
  xlCreate() { act(() => connectWorkbook(null), "Workbook created in your OneDrive and filled in."); },
  xlSync() { act(() => syncExcel(true), "Workbook updated."); },
  xlForget() { act(async () => { await S.store.set("settings/excel", { itemId: null, forgottenAt: Date.now() }); await audit("excel.disconnected", "Stopped updating the workbook"); }); },
  impBack() { if (S.imp) { S.imp.step = "map"; changed(); } },
  impMatch() { if (S.imp) { buildGroups(S.imp); S.imp.step = "match"; changed(); } },
  impApply() { act(applyImport, "Import finished."); },
  impUndo(d) {
    if (S.undoArmed !== d.id) { S.undoArmed = d.id; changed(); setTimeout(() => { if (S.undoArmed === d.id) { S.undoArmed = null; changed(); } }, 5000); return; }
    S.undoArmed = null;
    act(() => undoImport(d.id), "Import undone. Those starting balances are back to zero.");
  },
  loadSetup() {
    act(async () => {
      const el = document.getElementById("lemsic-seed");
      if (!el) throw new UserError("The starting setup isn't included in this page.");
      const docs = JSON.parse(el.textContent).docs;
      for (const [path, data] of Object.entries(docs)) {
        if (!(await S.store.get(path))) await S.store.set(path, data);
      }
      await audit("setup.loaded", "Loaded the starting term, committees and rubric");
    }, "Starting setup loaded.");
  },
  signOut() { if (S.fb) S.fb.AU.signOut(S.fb.auth); },
  async exportXlsx() {
    act(async () => {
      const buf = await workbookBytes();
      await saveFile(`LeMSIC Points ${today()}${S.mode === "demo" ? " (demo)" : ""}.xlsx`, new Uint8Array(buf), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    });
  },
};

window.addEventListener("error", () => { /* keep the page usable; nothing to do here */ });
render();
boot();
})();
</script>
